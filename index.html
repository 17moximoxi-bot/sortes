  [7,646,"Ibant aequati numero regemque canebant.","They marched in equal ranks and sang of the king.","他们排列整齐地行进，歌唱着国王。"],
  [7,803,"Bellatrix.","A warrior woman.","女战士。"],

  // ··· Book VIII: 联盟与神盾 ···
  [8,26,"Ego te, quae plurima fando / enumerare vales, numquam negate promeritam.","I shall never deny all that you can recount in speech as well deserved.","你在话语中能列举的一切功劳，我绝不否认。"],
  [8,36,"O luce magis dilecta sorori.","O you more beloved to your sister than the light.","比光明更为姐姐所深爱的人啊。"],
  [8,59,"Nympha, decus fluviorum, animo gratissima nostro.","Nymph, glory of the rivers, most dear to our heart.","仙女啊，河流的荣耀，我们心中最珍爱的。"],
  [8,310,"Haec nemora indigenae Fauni Nymphaeque tenebant.","These groves were held by native Fauns and Nymphs.","这些林地曾属于本土的牧神和仙女。"],
  [8,347,"Passimque armenta videbant / Romanoque foro et lautis mugire Carinis.","And everywhere they saw cattle lowing in the Roman forum and the elegant Carinae.","他们到处看到牛群在罗马广场和华丽的卡里奈区中低鸣。"],
  [8,380,"Excudunt alii spirantia mollius aera.","Others will hammer out bronzes that breathe more softly.","别人会铸造出更柔美的呼吸着的铜像。"],
  [8,388,"Cum femina primum, / foeda ministeria et famulatum ingrata subibat.","When first a woman undertook the foul service and unwelcome slavery.","当一个女人第一次承担起那肮脏的职责和不受欢迎的奴役时。"],
  [8,524,"Arma inter nubem caeli in regione serena / per sudum rutilare videt.","He sees arms gleaming red through clear sky in the serene region of heaven amid clouds.","他看见武器在云间、在天空宁静的区域中闪烁着红光。"],
  [8,537,"Hinc Augustum agmen et omnis / comitum adfulsit honos.","Then the august company shone forth, and all the glory of the companions.","于是庄严的队伍闪耀登场，同伴们的一切荣光绽放。"],
  [8,560,"Breve et inreparabile tempus / omnibus est vitae.","Brief and irreparable is the time of life for all.","生命的时光对所有人都短暂且不可挽回。"],
  [8,612,"Ille dies primus leti primusque malorum.","That day was the first of death and the first of evils.","那一天是死亡的开端，也是一切灾祸的开端。"],

  // ··· Book IX: 围城与牺牲 ···
  [9,6,"Quod optanti divum promittere nemo / auderet.","What no god would dare promise to one who prayed.","即使有人祈求也没有神灵敢许诺的。"],
  [9,44,"Bello non indebita praeda.","Spoil not undeserved by war.","战争中理应获得的战利品。"],
  [9,95,"Hae tibi erunt artes.","These shall be your arts.","这些将是你的技艺。"],
  [9,176,"Cadit et Ripheus.","Ripheus too falls.","里菲乌斯也倒下了。"],
  [9,186,"An sua cuique deus fit dira cupido?","Or does each person's fierce desire become their god?","还是每个人炽烈的渴望本身就成了他的神？"],
  [9,205,"Nulla dies umquam memori vos eximet aevo.","No day shall ever erase you from the memory of time.","没有任何一天能将你们从时间的记忆中抹去。"],
  [9,249,"Euryale, an haec frustra procedunt omina nobis?","Euryalus, do these omens proceed in vain for us?","欧律阿卢斯，这些征兆对我们来说是徒劳的吗？"],
  [9,320,"Per iuga, per silvas, interque horrentia lustra.","Through ridges, through forests, and among the bristling thickets.","穿过山脊，穿过森林，在荆棘丛中穿行。"],
  [9,390,"Ecce autem primo stellis ardentibus aptae / noctis iter.","But look — fitted to the first stars of burning night, the journey.","但看——迎着燃烧夜空的最初星辰，旅途展开。"],
  [9,404,"Multa boum circa mactantur corpora Morti.","Many cattle are slaughtered around, offerings to Death.","许多牛被宰杀，作为献给死亡的祭品。"],
  [9,431,"Volvitur Euryalus leto.","Euryalus falls in death.","欧律阿卢斯在死亡中倒下。"],
  [9,446,"Purpureus veluti cum flos succisus aratro.","As a purple flower cut by the plough.","如同被犁铧割断的紫色花朵。"],
  [9,525,"Iamque aderant portis.","And now they were at the gates.","此刻他们已到达城门。"],
  [9,617,"Caedicus Alcathoum obtruncat.","Caedicus strikes down Alcathous.","卡埃迪库斯斩倒阿尔卡托乌斯。"],

  // ··· Book X: 众神与战斗 ···
  [10,18,"Sua cuique exorsa laborem / fortunamque ferent.","Each shall bear the toil and fortune of their own beginning.","每个人都将承受自己起步时的辛劳和命运。"],
  [10,45,"Nullo discrimine habebo.","I shall make no distinction.","我不会作任何区分。"],
  [10,61,"Rex Iuppiter omnibus idem.","King Jupiter is the same to all.","朱庇特王对所有人一视同仁。"],
  [10,104,"Fata viam invenient.","The fates will find a way.","命运会找到它的路。"],
  [10,159,"Tros Tyriusve mihi nullo discrimine agetur.","Trojan or Tyrian — I shall treat them with no distinction.","特洛伊人还是提尔人——我将一视同仁地对待。"],
  [10,275,"Pandite nunc Helicona, deae.","Open now Helicon, goddesses.","女神们，现在打开赫利孔山。"],
  [10,310,"Dulcis moriens reminiscitur Argos.","Dying, he remembers sweet Argos.","临终时，他想起了甜蜜的阿尔戈斯。"],
  [10,454,"Sic fata deum rex / sortitur.","So the king of gods allots the fates.","众神之王如此分配命运。"],
  [10,485,"Disce, puer, virtutem ex me verumque laborem, / fortunam ex aliis.","Learn valour from me, boy, and true toil — fortune from others.","少年啊，从我身上学习勇气和真正的辛劳——运气就从别人那里学吧。"],
  [10,517,"Nunc morere.","Now die.","现在去死吧。"],
  [10,557,"Nulla manus, belli pacisque repertor.","No hand found him, that inventor of war and peace.","没有人找到他——那位战争与和平的缔造者。"],
  [10,743,"Animam proiectam obiit.","He met a death with his life cast away.","他带着被抛弃的生命迎接死亡。"],
  [10,782,"Dextra mihi deus et telum quod missile libro.","My right hand is my god, and the spear I hurl.","我的右手就是我的神，我投出的长矛就是我的武器。"],
  [10,825,"Vitaque cum gemitu fugit indignata sub umbras.","And life with a groan fled indignant to the shades.","生命带着一声叹息，愤然逃向幽冥。"],

  // ··· Book XI: 悲痛与休战 ···
  [11,14,"Maxima res effecta, viri; timor omnis abesto / quod superest.","The greatest deed is done, men; let all fear be gone for what remains.","最伟大的事已经完成了，战士们；余下的事不必再有恐惧。"],
  [11,42,"Nos iuvenum primi, nos bello profuturi.","We, the first of the young, we who will serve in war.","我们，年轻人中的先锋，我们将为战争效力。"],
  [11,96,"Multosque per annos / errabimus.","And for many years we shall wander.","我们将漂泊许多年。"],
  [11,124,"Non haec humanis opibus, non arte magistra / proveniunt.","These things come not from human strength, nor from a master's art.","这些不是人力所能及，也非大师的技艺所能造就。"],
  [11,152,"Pacem me exanimis et Martis sorte peremptis / oratis.","You beg peace of me for the dead and those destroyed by the lot of war.","你们向我乞求和平——为了那些死者和被战争命运消灭的人。"],
  [11,178,"Fato merita morte tulerunt.","By fate they met a deserved death.","他们以命运注定的死亡离去。"],
  [11,232,"Gens inimica mihi Tyrrhenum navigat aequor.","A race hostile to me sails the Tyrrhenian sea.","一个与我为敌的种族在第勒尼安海上航行。"],
  [11,306,"Nulla salus bello.","There is no safety in war.","战争中没有安全。"],
  [11,336,"Unus homo nobis cunctando restituit rem.","One man by delaying restored the state for us.","一个人凭借拖延为我们挽救了国家。"],
  [11,410,"Nec Turno mora.","And Turnus does not delay.","图尔努斯毫不迟疑。"],
  [11,458,"O dolor atque decus magnum rediture parenti.","O grief and great glory destined to return to your father.","悲痛啊，即将带给父亲的巨大荣耀与哀伤。"],
  [11,535,"Velocem interea superis in sedibus Opim / compellat Diana.","Meanwhile Diana addresses swift Opis in the seats above.","与此同时，狄安娜在上界的座席上对敏捷的奥比斯说话。"],
  [11,587,"At medias inter caedes exsultat Amazon.","But amid the slaughter the Amazon exults.","但在屠杀之中，亚马逊女战士欢腾着。"],
  [11,664,"Obstipuit varia confusa imagine rerum / Turnus.","Turnus stood stunned, confounded by the shifting images of events.","图尔努斯呆立当场，被事态变幻的景象弄得不知所措。"],
  [11,845,"Tum frigida toto / paulatim exsolvit se corpore.","Then the cold gradually released itself from her whole body.","然后寒意从她全身慢慢散去。"],

  // ··· Book XII: 最终的决斗 ···
  [12,1,"Turnus ut infractos adverso Marte Latinos / defecisse videt.","When Turnus sees that the Latins, broken by the adverse war, have lost heart.","当图尔努斯看到拉丁人在不利的战局中丧失了斗志。"],
  [12,10,"Moriamur et in media arma ruamus.","Let us die and rush into the midst of arms.","让我们赴死，冲向战斗的核心。"],
  [12,48,"Sola mihi bello capta puella est.","The girl alone was my prize of war.","那少女是我唯一的战利品。"],
  [12,73,"Abstulit atra dies et funere mersit acerbo.","The dark day swept him away and plunged him in bitter death.","黑暗的日子将他夺走，把他沉入苦涩的死亡。"],
  [12,95,"Sanguine placandum.","It must be appeased with blood.","必须以鲜血来平息。"],
  [12,113,"Si fata negarint.","If the fates deny.","如果命运拒绝。"],
  [12,152,"Audiat haec genitor qui foedera fulmine sancit.","Let the father who sanctions treaties with his thunderbolt hear this.","让那以雷霆确认条约的天父听到这一切。"],
  [12,176,"Terra mihi, aequor et astra.","Earth, sea, and stars are my witnesses.","大地、海洋和星辰为我作证。"],
  [12,234,"Tollitur in caelum clamor.","A cry rises to heaven.","一声呐喊冲上云霄。"],
  [12,282,"Heu stirpem invisam et fatis contraria nostris.","Alas, the hated race and Phrygian fates opposed to ours.","可恨的种族啊，弗里吉亚人的命运与我们势不两立。"],
  [12,313,"Nec minus interea maternis saevus in armis / Aeneas.","No less fierce meanwhile in his mother's arms is Aeneas.","与此同时，埃涅阿斯在母亲赐予的武器中同样凶猛。"],
  [12,366,"Demens, qui nimbos et non imitabile fulmen.","Fool, who tried to imitate storm clouds and the inimitable thunderbolt.","愚蠢的人，竟想模仿风暴和不可模仿的雷霆。"],
  [12,397,"Si qua interea fida pectora movet.","If meanwhile any loyal hearts stir.","如果此间还有忠诚的心在跳动。"],
  [12,430,"Iamque adeo exierat portis.","And now he had come forth from the gates.","此刻他已从城门走出。"],
  [12,486,"Nec se vir fortis dat talia sentire.","The brave man does not let himself feel such things.","勇者不会让自己感受到这些。"],
  [12,527,"Nec mortale tumens, adflata est numine Iunonis.","Swelling with no mortal force, breathed upon by the power of Juno.","膨胀着超凡的力量，被朱诺的神力吹拂。"],
  [12,554,"Sero revocat.","Too late he recalls.","为时已晚，他才想起。"],
  [12,630,"Terga dabo et Turnum fugientem haec terra videbit?","Shall I turn my back and this land see Turnus in flight?","我要转身逃跑，让这片土地看到图尔努斯在逃亡？"],
  [12,646,"Nec iam ego, nec terga Rutuli dant.","Neither I nor the Rutulians turn our backs.","我不会退却，鲁图利人也不会转身逃跑。"],
  [12,679,"Iam iam fata, soror, superant; absiste morari.","Now, now the fates prevail, sister; cease to delay.","现在，命运已经占了上风，姐姐；不要再拖延了。"],
  [12,693,"Nec plura his; ipse gradum contra tulit.","No more than this; he himself stepped forward to meet him.","他不再多说——自己迈步迎上前去。"],
  [12,725,"Jupiter ipse duas aequato examine lances.","Jupiter himself holds two scales in equal balance.","朱庇特亲自托起两端平衡的天平。"],
  [12,791,"Tantane vos generis tenuit fiducia vestri?","Did such great confidence in your race hold you?","对自己种族如此巨大的信心支撑着你们吗？"],
  [12,830,"Compositum nefas.","An arranged evil.","蓄谋已久的恶行。"],
  [12,843,"Nec Saturnia Iuno / ulterius movit.","Nor did Saturnian Juno urge further.","萨图尔努斯之女朱诺也不再推动。"],
  [12,869,"Vidit tristi cum corde Iuturna.","Juturna saw it with a sorrowful heart.","尤图尔娜以悲伤的心看到了这一切。"],
  [12,882,"Egone haec terris monstrum miserabile nostris / aspiciam?","Shall I, wretched, look upon this monster on our land?","我难道要眼睁睁看着我们的土地上出现这可悲的怪物？"],
  [12,911,"Saxum antiquum ingens campo quod forte iacebat.","A huge ancient stone that happened to lie in the field.","一块偶然躺在原野上的巨大古石。"],
  [12,919,"Sed neque currentem se nec cognoscit euntem.","But he recognizes himself neither running nor walking.","但他认不出正在奔跑或行走的自己。"],
  [12,938,"Tuque incipe fatis.","And you, begin your fate.","而你，开始你的命运吧。"],
  [12,947,"Ille, oculis postquam saevi monimenta doloris / exuviasque hausit.","He, after his eyes drank in the memorials of savage grief and the spoils.","他的双眼饱览了残酷悲痛的遗物和战利品之后。"],
  [12,950,"Tune hinc spoliis indute meorum / eripiare mihi?","Shall you, wearing the spoils of my people, be snatched from me?","穿着我亲人甲胄的你，竟想从我手中逃脱？"],

// ——— EXPANSION III: 冲刺 666 ———

// Book I 补充
  [1,94,"O socii — neque enim ignari sumus ante malorum.","O companions — for we are not unacquainted with earlier evils.","伙伴们——我们对从前的苦难并非一无所知。"],
  [1,198,"Sunt lacrimae rerum et mentem mortalia tangunt.","There are tears for things and mortal matters touch the mind.","万物皆有泪，凡人之事触动心灵。"],
  [1,199,"Solve metus; feret haec aliquam tibi fama salutem.","Release your fears; this fame will bring you some salvation.","放下恐惧吧；这声名将为你带来某种拯救。"],
  [1,327,"Volvitur ille vomens calidum de pectore flumen.","He rolls, vomiting a warm stream from his chest.","他翻滚着，从胸口涌出一股温热的洪流。"],
  [1,405,"Obstipuit simul ipse, simul percussus Achates.","He himself was struck dumb, and at the same time Achates was struck.","他自己惊呆了，阿卡忒斯同时也被震慑。"],
  [1,411,"Ambrosiaeque comae divinum vertice odorem / spiravere.","And her ambrosial hair breathed a divine fragrance from her head.","她的仙发从头顶散发出神圣的芬芳。"],
  [1,437,"Lucus in urbe fuit media, laetissimus umbrae.","There was a grove in the middle of the city, most joyful in shade.","城中央有一片树林，荫影最为欣悦。"],
  [1,461,"Animum pictura pascit inani.","He feeds his spirit on the empty picture.","他以虚幻的图画喂养灵魂。"],
  [1,543,"Non ignara mali miseris succurrere disco.","Not ignorant of misfortune, I learn to help the wretched.","因为自己经历过不幸，我学会了救助苦难之人。"],

// Book II 补充
  [2,6,"Quis talia fando / Myrmidonum Dolopumve temperet a lacrimis?","Who, in telling such things, of Myrmidons or Dolopians could refrain from tears?","讲述这些事，密耳弥冬人或多洛普人谁能忍住眼泪？"],
  [2,49,"Timeo Danaos et dona ferentes.","I fear the Greeks even bearing gifts.","我害怕带着礼物的希腊人。"],
  [2,65,"Crimine ab uno disce omnes.","From one crime learn them all.","从一桩罪行认识所有人。"],
  [2,274,"Tempus erat quo prima quies mortalibus aegris.","It was the time when first rest comes to weary mortals.","那是疲惫凡人初获安息的时分。"],
  [2,281,"In somnis ecce ante oculos maestissimus Hector / visus adesse mihi.","In dreams, behold, before my eyes the most sorrowful Hector seemed to stand.","梦中，最悲伤的赫克托耳似乎出现在我眼前。"],
  [2,289,"Ei mihi, qualis erat, quantum mutatus ab illo!","Alas, what he looked like, how changed from that Hector!","天哪，他的模样，与当初判若两人！"],
  [2,354,"Una salus victis nullam sperare salutem.","The one salvation for the conquered is to hope for no salvation.","战败者唯一的救赎就是不再抱有救赎的希望。"],
  [2,594,"Apparent rari nantes in gurgite vasto.","A few swimmers appear in the vast abyss.","茫茫深渊中，零星几个泅水者浮现。"],
  [2,725,"Iam pridem invisam hoc deducite lumen.","Now at last lead away this light I have long hated.","终于把这盏我久已厌恶的光引走吧。"],

// Book III 补充
  [3,7,"Feror exsul in altum.","I am carried as an exile onto the deep.","我作为流亡者驶向深海。"],
  [3,44,"Quid miserum, Aenea, laceras? Iam parce sepulto.","Why do you tear me, wretched Aeneas? Spare me now in my grave.","你为何撕裂我这个可怜人，埃涅阿斯？饶了已入土的我吧。"],
  [3,48,"Heu fuge crudelis terras, fuge litus avarum.","Alas, flee the cruel lands, flee the greedy shore.","唉，逃离残忍的大地，逃离贪婪的海岸吧。"],
  [3,57,"Auri sacra fames!","Accursed hunger for gold!","可诅咒的黄金之饥！"],
  [3,94,"Da propriam, Thymbraee, domum.","Grant us a home of our own, Thymbraean Apollo.","赐我们一个自己的家吧，廷布拉的阿波罗。"],
  [3,182,"Antiquam exquirite matrem.","Seek out your ancient mother.","去寻找你们古老的母亲。"],
  [3,192,"Cretam proavosque petamus.","Let us seek Crete and our ancestors.","让我们前往克里特，寻找祖先。"],
  [3,284,"Cedite felices animae tutoque capessite portum.","Yield, blessed souls, and safely reach the harbor.","退让吧，幸福的灵魂们，安全抵达港口。"],
  [3,362,"Et canit errantes luna teste per umbras.","And she sings wandering through the shadows with the moon as witness.","她在月亮见证下，于阴影中游吟。"],
  [3,395,"Vina bonus quae deinde cadis onerarat Acestes.","The good wines which Acestes had loaded in casks.","善良的阿刻斯忒斯装满酒桶的佳酿。"],
  [3,493,"Vivite felices, quibus est fortuna peracta.","Live happily, you whose fortune is already fulfilled.","幸福地生活吧，你们的命运已经完成。"],
  [3,505,"Semper honos nomenque tuum laudesque manebunt.","Always your honor and your name and your praises will endure.","你的荣耀、名字和赞歌将永远长存。"],

// Book V 补充
  [5,5,"Nec iam amplius ullae / apparent terrae: caelum undique et undique pontus.","No lands appear any longer: sky on every side and sea on every side.","再也看不见任何陆地：四面是天空，四面是大海。"],
  [5,22,"Superanda omnis fortuna ferendo est.","Every fortune must be overcome by enduring it.","一切命运都要靠忍受来超越。"],
  [5,49,"Annuus exactis completur mensibus orbis.","The yearly cycle is completed as the months pass.","随着月份流逝，一年的轮回又已完成。"],
  [5,231,"Possunt quia posse videntur.","They can because they think they can.","他们能，因为他们相信自己能。"],
  [5,304,"Nulla dies umquam memori vos eximet aevo.","No day shall ever remove you from the memory of time.","任何日子都不能将你们从时间的记忆中抹去。"],
  [5,344,"Nate, meas si quis audeat adfligat opes.","Son, if anyone should dare to strike down my power.","吾子，若有人胆敢打击我的力量。"],
  [5,465,"Victor apud rapidum Simoenta sub Ilio alto.","A victor at the swift Simois beneath tall Ilium.","在高大的伊利翁城下、湍急的西摩伊斯河畔，一位胜者。"],
  [5,620,"Heu nihil invitis fas quemquam fidere divis.","Alas, it is not right for anyone to trust when the gods are unwilling.","唉，当神明不允许时，没有人可以心存信赖。"],
  [5,689,"Servate domum, servate nepotem.","Save the house, save the grandson.","保住家族，保住后代。"],
  [5,709,"Venisti tandem, tuaque exspectata parenti / vicit iter durum pietas.","You have come at last, and your devotion, longed for by your father, has conquered the hard road.","你终于来了，你父亲期盼的孝心征服了艰难的路途。"],
  [5,725,"Facilis descensus Averno.","Easy is the descent to Avernus.","下冥府的路很容易。"],
  [5,733,"Noctes atque dies patet atri ianua Ditis.","Night and day the gate of dark Dis lies open.","日日夜夜，黑暗冥王的大门敞开着。"],

// Book VII 补充
  [7,37,"Maior rerum mihi nascitur ordo.","A greater order of things is born for me.","一个更宏大的事物秩序正为我诞生。"],
  [7,45,"Nunc age, qui reges, quae tempora rerum.","Now come, what kings, what times of affairs.","现在说吧，什么样的君王，什么样的时代。"],
  [7,96,"Advenit qui vestra dies muliebribus armis / verba rediget.","The day comes which will reduce your words to womanish weapons.","那一天将来临，将你的言辞变为女人的武器。"],
  [7,170,"Atque haec deinde canit divino ex ore sacerdos.","And then the priestess sings these things from her divine mouth.","然后女祭司从她神圣的口中唱出这些话。"],
  [7,203,"Ipse Quirinali lituo parvaque sedebat / succinctus trabea.","He himself sat girt with the Quirinal staff and a small striped robe.","他自己坐着，佩着奎里纳尔的弯杖，系着小小的条纹袍。"],
  [7,312,"Flectere si nequeo superos, Acheronta movebo.","If I cannot bend the gods above, I will move the Acheron.","如果我无法撼动天上的神，我将搅动冥河。"],
  [7,385,"Nate, Latinae / magnae spes altera Romae.","Son, the other hope of great Latian Rome.","吾子，伟大拉丁罗马的另一个希望。"],
  [7,481,"Nunc potis est Turno sperare salutem.","Now Turnus may hope for salvation.","现在图尔努斯可以期望得救了。"],
  [7,541,"Sanguine placastis ventos et virgine caesa.","You appeased the winds with blood and a slaughtered maiden.","你们用鲜血和被杀的少女安抚了风。"],
  [7,594,"Saevit amor ferri et scelerata insania belli.","The love of the sword rages and the criminal madness of war.","对刀剑的爱在狂怒，战争的疯狂罪行在蔓延。"],

// Book VIII 补充
  [8,18,"Nox erat et terras animalia fessa per omnes.","It was night and weary creatures throughout all the lands.","夜晚降临，疲惫的生灵遍布大地。"],
  [8,36,"Nympha, decus fluviorum, animo gratissima nostro.","Nymph, glory of rivers, most welcome to our heart.","水仙啊，河流的光荣，最令我们心灵欢喜的。"],
  [8,112,"Hunc illum fatis externa ab sede profectum / portendi generum.","This one, coming from a foreign land by fate, is foretold as a son-in-law.","命运预示这个从异乡来的人将成为女婿。"],
  [8,314,"Haec nemora indigenae Fauni Nymphaeque tenebant.","These groves the native Fauns and Nymphs held.","这些树林原本属于本地的农牧神和仙女。"],
  [8,319,"Aurea quae perhibent illo sub rege fuere / saecula.","The golden ages which they say existed under that king.","他们说在那位王的统治下，是黄金时代。"],
  [8,364,"Aude, hospes, contemnere opes et te quoque dignum / finge deo.","Dare, guest, to scorn riches and fashion yourself also worthy of a god.","客人啊，敢于蔑视财富，也让自己配得上神明。"],
  [8,441,"Surgit ad auroram stellis fulgentibus aptum.","She rises to the dawn fitted with gleaming stars.","她在闪耀的星辰中迎着黎明升起。"],
  [8,514,"At Venus aetherios inter dea candida nimbos / dona ferens aderat.","But shining Venus amid ethereal clouds was present, bearing gifts.","但闪耀的维纳斯出现在天上的云层中，带着礼物。"],
  [8,560,"Ergo omnis furiis surrexit Etruria iustis.","Therefore all Etruria rose in righteous fury.","于是整个埃特鲁里亚在正义的愤怒中奋起。"],

const oracle = {
  data: O.map((r, i) => ({ idx: i + 1, book: r[0], line: r[1], la: r[2], en: r[3], zh: r[4] })),
  drawn: null,
  history: [],
};

const $ = id => document.getElementById(id);

function showOracle(entry) {
  $('oracleNum').value = String(entry.idx).padStart(3, '0');
  $('oracleRef').textContent = `Aeneis ${toRoman(entry.book)}`;
  $('oracleBook').textContent = BOOKS[entry.book];
  $('oracleLatin').textContent = entry.la;
  $('oracleEn').textContent = entry.en;
  $('oracleZh').textContent = entry.zh;

  const display = $('oracleDisplay');
  const card = $('oracleCard');
  display.classList.remove('visible');
  card.classList.remove('drawing');
  void card.offsetWidth;
  display.classList.add('visible');
  card.classList.add('drawing');
}

function draw() {
  const btn = $('drawBtn');
  const display = $('oracleDisplay');
  btn.disabled = true;

  display.classList.add('shuffling');
  let count = 0;
  const total = 12;
  const interval = setInterval(() => {
    const rand = oracle.data[Math.floor(Math.random() * oracle.data.length)];
    $('oracleNum').value = String(rand.idx).padStart(3, '0');
    count++;
    if (count >= total) {
      clearInterval(interval);
      display.classList.remove('shuffling');

      const entry = oracle.data[Math.floor(Math.random() * oracle.data.length)];
      oracle.drawn = entry;
      oracle.history.push(entry.idx);
      showOracle(entry);
      btn.disabled = false;
      $('btnText').textContent = 'Iterum Consulere';
      $('countText').textContent = `${oracle.data.length} verses from XII books`;
    }
  }, 60);
}

function copyOracle() {
  if (!oracle.drawn) return;
  const e = oracle.drawn;
  const text = `Sortes Vergilianae — Aeneis ${toRoman(e.book)}\n\n${e.la}\n\n${e.en}\n\n${e.zh}`;
  try {
    navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard')).catch(() => selectFallback(text));
  } catch { selectFallback(text); }
}

function selectFallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  showToast('Select and copy the text');
  setTimeout(() => ta.remove(), 3000);
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function toRoman(n) {
  const vals = [1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const syms = ['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let r = '';
  for (let i = 0; i < vals.length; i++) while (n >= vals[i]) { r += syms[i]; n -= vals[i]; }
  return r;
}

function lookupByNumber(n) {
  if (!n || isNaN(n) || n < 1) return;
  const len = oracle.data.length;
  const idx = ((n - 1) % len) + 1;
  const entry = oracle.data[idx - 1];
  oracle.drawn = entry;
  oracle.history.push(entry.idx);
  showOracle(entry);
}

const numInput = $('oracleNum');
numInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); numInput.blur(); }
});
numInput.addEventListener('blur', () => {
  const n = parseInt(numInput.value, 10);
  if (n && !isNaN(n) && n >= 1 && oracle.drawn && n !== oracle.drawn.idx) {
    lookupByNumber(n);
  }
});

$('drawBtn').addEventListener('click', draw);
$('copyBtn').addEventListener('click', copyOracle);
$('againBtn').addEventListener('click', draw);
$('countText').textContent = `${oracle.data.length} verses from XII books`;
</script>
