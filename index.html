<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sortes">
<meta name="theme-color" content="#0B1026">
<title>Sortes Vergilianae</title>
<style>
  /* Layout: centered ritual oracle, single-column focus */
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif+SC:wght@400;500;600&display=swap');

  :root {
    --bg: #0B1026;
    --bg-surface: #111733;
    --bg-card: #161D3F;
    --fg: #E8DFD0;
    --fg-muted: #9A917F;
    --fg-dim: #5C5647;
    --gold: #C9A84C;
    --gold-light: #E8D5A3;
    --gold-dim: #7A6A30;
    --accent: #8B3A4A;
    --accent-light: #C25A6E;
    --font-display: 'Cinzel', 'Times New Roman', serif;
    --font-body: 'Cormorant Garamond', 'Georgia', serif;
    --font-zh: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    color-scheme: dark;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F5F0E8;
      --bg-surface: #EDE6D8;
      --bg-card: #E5DDD0;
      --fg: #1A1A2E;
      --fg-muted: #5A5347;
      --fg-dim: #9A917F;
      --gold: #8B7332;
      --gold-light: #A68B3D;
      --gold-dim: #C9B87A;
      --accent: #8B3A4A;
      --accent-light: #A04858;
      color-scheme: light;
    }
  }

  :root[data-theme="light"] {
    --bg: #F5F0E8;
    --bg-surface: #EDE6D8;
    --bg-card: #E5DDD0;
    --fg: #1A1A2E;
    --fg-muted: #5A5347;
    --fg-dim: #9A917F;
    --gold: #8B7332;
    --gold-light: #A68B3D;
    --gold-dim: #C9B87A;
    --accent: #8B3A4A;
    --accent-light: #A04858;
    color-scheme: light;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    margin: 0;
    padding: 0 16px;
    padding-block: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  .container {
    max-width: 680px;
    width: 100%;
    padding: 48px 0 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 48px;
  }

  .header h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.6rem, 4.5vw, 2.4rem);
    color: var(--gold);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 8px;
    text-wrap: balance;
  }

  .header .subtitle {
    font-family: var(--font-display);
    font-size: clamp(0.72rem, 2vw, 0.85rem);
    color: var(--fg-muted);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin: 0 0 28px;
  }

  /* Divider ornament */
  .ornament {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 32px 0;
    width: 100%;
    max-width: 300px;
  }

  .ornament::before,
  .ornament::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }

  .ornament .diamond {
    width: 6px;
    height: 6px;
    background: var(--gold-dim);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* Draw button */
  .draw-section {
    text-align: center;
    margin: 16px 0 40px;
  }

  .draw-btn {
    font-family: var(--font-display);
    font-size: 1rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    background: transparent;
    border: 1.5px solid var(--gold-dim);
    padding: 16px 48px;
    cursor: pointer;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
  }

  .draw-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--gold);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .draw-btn:hover {
    border-color: var(--gold);
    color: var(--bg);
  }

  .draw-btn:hover::before {
    opacity: 1;
  }

  .draw-btn span {
    position: relative;
    z-index: 1;
  }

  .draw-btn:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 4px;
  }

  .draw-btn:active {
    transform: scale(0.97);
  }

  /* Oracle display */
  .oracle {
    width: 100%;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    pointer-events: none;
  }

  .oracle.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .oracle-card {
    background: var(--bg-card);
    border: 1px solid var(--gold-dim);
    padding: clamp(28px, 6vw, 48px);
    position: relative;
  }

  .oracle-card::before,
  .oracle-card::after {
    content: '';
    position: absolute;
    width: 24px;
    height: 24px;
    border-color: var(--gold-dim);
    border-style: solid;
  }

  .oracle-card::before {
    top: 8px;
    left: 8px;
    border-width: 1px 0 0 1px;
  }

  .oracle-card::after {
    bottom: 8px;
    right: 8px;
    border-width: 0 1px 1px 0;
  }

  .oracle-ref {
    font-family: var(--font-display);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-dim);
    text-align: center;
    margin-bottom: 6px;
  }

  .oracle-book {
    font-family: var(--font-display);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: var(--fg-dim);
    text-align: center;
    margin-bottom: 28px;
  }

  .oracle-latin {
    font-family: var(--font-display);
    font-size: clamp(1.05rem, 3vw, 1.3rem);
    font-weight: 500;
    color: var(--gold-light);
    line-height: 1.7;
    text-align: center;
    margin-bottom: 28px;
    font-style: italic;
  }

  .oracle-en {
    font-family: var(--font-body);
    font-size: clamp(1rem, 2.8vw, 1.15rem);
    color: var(--fg);
    line-height: 1.75;
    text-align: center;
    margin-bottom: 20px;
    font-style: italic;
  }

  .oracle-zh {
    font-family: var(--font-zh);
    font-size: clamp(0.95rem, 2.5vw, 1.05rem);
    color: var(--fg-muted);
    line-height: 1.85;
    text-align: center;
  }

  /* Drawing animation */
  .drawing .oracle-latin,
  .drawing .oracle-en,
  .drawing .oracle-zh {
    animation: shimmer 0.6s ease-in-out;
  }

  @keyframes shimmer {
    0% { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .oracle-en { animation-delay: 0.15s; animation-fill-mode: both; }
  .drawing .oracle-en { animation-delay: 0.15s; }
  .drawing .oracle-zh { animation-delay: 0.3s; }

  /* Number display */
  .oracle-number {
    font-family: var(--font-display);
    font-size: clamp(3rem, 8vw, 4.5rem);
    font-weight: 700;
    color: var(--gold-dim);
    text-align: center;
    margin-bottom: 24px;
    opacity: 0.35;
    line-height: 1;
    background: none;
    border: none;
    border-bottom: 1.5px dashed transparent;
    width: 100%;
    padding: 0;
    outline: none;
    cursor: text;
    transition: border-color 0.3s ease, opacity 0.3s ease;
  }

  .oracle-number:hover,
  .oracle-number:focus {
    opacity: 0.6;
    border-bottom-color: var(--gold-dim);
  }

  /* Footer actions */
  .oracle-actions {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 32px;
  }

  .action-btn {
    font-family: var(--font-display);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--fg-dim);
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 16px;
    transition: color 0.3s ease;
  }

  .action-btn:hover {
    color: var(--gold);
  }

  .action-btn:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  /* Copy toast */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    font-family: var(--font-display);
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--gold);
    background: var(--bg-card);
    border: 1px solid var(--gold-dim);
    padding: 10px 24px;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    z-index: 100;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Shuffle animation */
  @keyframes shuffleNum {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.6; }
  }

  .shuffling .oracle-number {
    animation: shuffleNum 0.1s linear infinite;
  }

  /* Footer info */
  .footer {
    margin-top: 56px;
    text-align: center;
    padding-bottom: 32px;
  }

  .footer p {
    font-family: var(--font-body);
    font-size: 0.85rem;
    color: var(--fg-dim);
    line-height: 1.7;
    margin: 4px 0;
  }

  .footer .zh {
    font-family: var(--font-zh);
    font-size: 0.8rem;
  }

  /* Count display */
  .count {
    font-family: var(--font-display);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--fg-dim);
    text-align: center;
    margin-top: 12px;
  }

  @media (prefers-reduced-motion: reduce) {
    .oracle { transition: opacity 0.2s ease; }
    .oracle-latin, .oracle-en, .oracle-zh { animation: none !important; }
    .shuffling .oracle-number { animation: none !important; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Sortes Vergilianae</h1>
    <p class="subtitle">维吉尔神谕</p>
    <div class="ornament"><div class="diamond"></div></div>
  </div>

  <div class="draw-section">
    <button class="draw-btn" id="drawBtn" aria-label="Draw an oracle">
      <span id="btnText">Consulere Fata</span>
    </button>
    <p class="count" id="countText"></p>
  </div>

  <div class="oracle" id="oracleDisplay">
    <div class="oracle-card" id="oracleCard">
      <input class="oracle-number" id="oracleNum" type="text" inputmode="numeric" maxlength="4" aria-label="Oracle number">
      <div class="oracle-ref" id="oracleRef"></div>
      <div class="oracle-book" id="oracleBook"></div>
      <div class="ornament" style="margin: 20px auto;"><div class="diamond"></div></div>
      <div class="oracle-latin" id="oracleLatin"></div>
      <div class="oracle-en" id="oracleEn"></div>
      <div class="oracle-zh" id="oracleZh"></div>
    </div>
    <div class="oracle-actions">
      <button class="action-btn" id="copyBtn">Copy</button>
      <button class="action-btn" id="againBtn">Draw Again</button>
    </div>
  </div>

  <div class="footer">
    <div class="ornament" style="margin: 0 auto 20px;"><div class="diamond"></div></div>
    <p>P. Vergilius Maro, <em>Aeneis</em>, 29–19 BCE</p>
    <p class="zh">普布利乌斯·维吉利乌斯·马罗，《埃涅阿斯纪》</p>
  </div>
</div>

<div class="toast" id="toast">Copied to clipboard</div>

const O = [
  // ——— BOOK I: Storm, Carthage, Juno's Wrath ———
  [1,1,"Arma virumque cano, Troiae qui primus ab oris","Arms, and the man I sing, who first from Troy's shores","我歌唱武器与英雄，他最先从特洛伊的海岸启程"],
  [1,11,"Musa, mihi causas memora, quo numine laeso","Muse, tell me the causes — what wounded divinity","缪斯啊，告诉我缘由——是什么被冒犯的神力"],
  [1,33,"Tantaene animis caelestibus irae?","Can such anger dwell in heavenly minds?","天神的心中，竟也容得下如此深重的怒火？"],
  [1,94,"O terque quaterque beati, / quis ante ora patrum Troiae sub moenibus altis / contigit oppetere!","O thrice and four times blessed, those who fell before their fathers' eyes beneath Troy's high walls!","三倍四倍幸福的人啊，你们在父辈面前、在特洛伊高墙之下倒下！"],
  [1,198,"Forsan et haec olim meminisse iuvabit.","Perhaps one day it will be a joy to remember even these things.","也许有一天，回忆这些苦难也将成为一种欢欣。"],
  [1,202,"Durate, et vosmet rebus servate secundis.","Endure, and preserve yourselves for better days.","坚持住，把自己留给更好的时日。"],
  [1,204,"O socii — neque enim ignari sumus ante malorum.","O companions — for we are not unacquainted with suffering.","同伴们——我们对苦难并不陌生。"],
  [1,278,"His ego nec metas rerum nec tempora pono: / imperium sine fine dedi.","To these I set no bounds in space or time: I have given them empire without end.","我不为他们设下疆域或时间的界限：我赐予了他们无尽的统治。"],
  [1,327,"Quem das finem, rex magne, laborum?","What end to their labours do you grant, great king?","伟大的王啊，你何时让他们的苦难终结？"],
  [1,405,"Et vera incessu patuit dea.","And by her gait she was revealed, a true goddess.","她的步履暴露了她——一位真正的女神。"],
  [1,462,"Sunt lacrimae rerum et mentem mortalia tangunt.","There are tears for things, and mortal sorrows touch the heart.","万物皆有泪，人世的苦痛触动人心。"],
  [1,463,"Solve metus; feret haec aliquam tibi fama salutem.","Release your fear; this fame will bring you some salvation.","放下恐惧；这声名将为你带来某种救赎。"],
  [1,574,"Non ignara mali miseris succurrere disco.","Not unacquainted with grief, I learn to aid the wretched.","我自己也尝过苦难，因此学会了怜悯不幸的人。"],
  [1,630,"Dux femina facti.","A woman was the leader of the deed.","领导这一切的，是一位女性。"],
  [1,203,"O passi graviora, dabit deus his quoque finem.","O you who have endured worse things, god will give an end to these as well.","承受过更大苦难的人啊，神也会给这一切一个终结。"],
  [1,387,"Quisquis es, haud, credo, invisus caelestibus auras / vitalis carpis.","Whoever you are, not hated by the gods, I think, you breathe the air of life.","无论你是谁，你既能呼吸生命的空气，我想天神并未厌弃你。"],
  [1,607,"Vos ego nec terris nec fluctibus ullis / egentes laudo.","I praise you who want for nothing on land or sea.","你们在陆地和海洋上都不匮乏——我赞颂你们。"],

  // ——— BOOK II: The Fall of Troy ———
  [2,3,"Infandum, regina, iubes renovare dolorem.","Unspeakable, O queen, is the grief you bid me renew.","女王，你命我重提的是不可言说的悲痛。"],
  [2,6,"Quaeque ipse miserrima vidi, / et quorum pars magna fui.","The most pitiful things I myself saw, and of which I was a great part.","我亲眼目睹了最惨痛的一切，而我自己也是其中重要的一部分。"],
  [2,49,"Timeo Danaos et dona ferentes.","I fear the Greeks, even bearing gifts.","我恐惧希腊人，即便他们带着礼物。"],
  [2,274,"Tempus erat quo prima quies mortalibus aegris / incipit.","It was the hour when first rest begins for weary mortals.","那是疲惫的凡人开始获得最初安眠的时辰。"],
  [2,281,"In somnis, ecce, ante oculos maestissimus Hector / visus adesse mihi.","In sleep, behold, before my eyes, Hector appeared most sorrowful.","在梦中，看啊，赫克托耳最悲伤的面容出现在我眼前。"],

  [2,324,"Moriamur et in media arma ruamus.","Let us die and rush into the thick of battle.","让我们赴死，冲进战斗的中心。"],
  [2,354,"Una salus victis nullam sperare salutem.","The one safety for the conquered is to hope for no safety.","战败者唯一的救赎，是不再指望任何救赎。"],

  [4,174,"Fama, malum qua non aliud velocius ullum.","Rumour, than whom no other evil is swifter.","流言——没有什么恶比它更快。"],
  [4,223,"Hic pietatis honos? Sic nos in sceptra reponis?","Is this the reward of devotion? Is this how you restore us to power?","这就是虔诚的报偿？你就这样恢复我们的王权？"],
  [4,265,"Naviget! Haec summa est; hic nostri nuntius esto.","Let him sail! This is the sum of it; let this be my message.","让他启航！这就是一切；让这成为我的旨意。"],
  [4,296,"Varium et mutabile semper / femina.","A fickle and changeable thing is woman always.","女人永远是善变而无常之物。"],
  [4,361,"Desine meque tuis incendere teque querelis.","Cease to inflame both me and yourself with your complaints.","别再用你的哀怨焚烧你我。"],
  [4,373,"Nec tibi diva parens generis nec Dardanus auctor, / perfide.","Neither was a goddess your mother, nor Dardanus your ancestor, faithless one.","你的母亲不是女神，达达努斯也不是你的祖先，背信之人。"],
  [4,449,"Mens immota manet, lacrimae volvuntur inanes.","His mind remains unmoved; the tears fall in vain.","他的心志纹丝不动；泪水徒然滚落。"],
  [4,569,"Italiam non sponte sequor.","I do not pursue Italy of my own will.","我追寻意大利，并非出于自愿。"],
  [4,625,"Exoriare aliquis nostris ex ossibus ultor.","Rise, some avenger, from my bones!","从我的骨灰中升起吧，某位复仇者！"],
  [4,629,"Litora litoribus contraria, fluctibus undas / imprecor, arma armis: pugnent ipsique nepotesque.","Shore against shore, wave against wave, sword against sword I pray: let them fight, they and their children's children.","我诅咒海岸与海岸为敌，波浪与波浪对抗，刀剑与刀剑相向——让他们世世代代征战不休。"],
  [4,653,"Vixi, et quem dederat cursum fortuna peregi.","I have lived, and completed the course that fortune gave me.","我活过了，走完了命运赋予我的路。"],
  [4,660,"Dulces exuviae, dum fata deusque sinebat, / accipite hanc animam.","Sweet relics, while fate and god allowed, receive this soul.","甜蜜的遗物啊，趁命运和神明还允许，接受这灵魂吧。"],

  // ——— BOOK V: Funeral Games in Sicily ———
  [5,231,"Possunt, quia posse videntur.","They can, because they think they can.","他们能做到，因为他们相信自己能做到。"],
  [5,344,"Non iam prima peto; de tribus ultima malo.","I no longer seek first place; last of three I prefer.","我不再争第一；三个之中最末，我甘愿。"],
  [5,710,"Tu ne cede malis, sed contra audentior ito, / quam tua te Fortuna sinet.","Yield not to misfortunes, but go forth more boldly against them than your Fortune allows.","不要向厄运屈服，而要比命运允许的更勇敢地前行。"],
  [5,725,"Facilis iactura sepulcri.","The loss of a tomb is a small thing.","失去一座坟墓算不了什么。"],
  [5,733,"Sic pater Aeneas, et multum cunctis maerens.","So spoke father Aeneas, grieving greatly among all.","埃涅阿斯如此说道，在所有人中最为悲伤。"],
  [5,770,"Nec revocare gradum superasque evadere ad auras / hoc opus, hic labor est.","Not to recall your step and escape to the upper air — this is the task, this the toil.","不是回转脚步、逃向上方的空气——这才是真正的考验。"],
  [5,796,"Unum pro multis dabitur caput.","One life shall be given for many.","一人之命将为众人而献。"],
  [5,849,"Dixit, et in verba iurandum postulat ensem.","He spoke, and demanded a sword on which to swear.","他说完，要求一把剑来立誓。"],

  // ——— BOOK VI: The Underworld ———
  [6,95,"Facilis descensus Averno; / noctes atque dies patet atri ianua Ditis.","Easy is the descent to Avernus; night and day the door of dark Dis stands open.","下冥界的路是容易的；日日夜夜，幽暗冥王的门都敞开着。"],
  [6,128,"Sed revocare gradum superasque evadere ad auras, / hoc opus, hic labor est.","But to retrace your steps and escape to the upper air — this is the task, this the toil.","但要回转脚步、逃回上方的空气——这才是考验，这才是艰辛。"],
  [6,131,"Pauci, quos aequus amavit / Iuppiter, aut ardens evexit ad aethera virtus.","Few, whom just Jupiter loved, or whom blazing virtue lifted to the sky.","只有少数人——被公正的朱庇特所爱，或被炽烈的美德送上苍穹。"],
  [6,143,"Latet arbore opaca / aureus et foliis et lento vimine ramus.","Hidden in a dark tree, a golden bough with golden leaves and pliant stem.","在幽暗的树中隐藏着金色的枝条，金叶与柔韧的茎。"],
  [6,258,"Procul, o procul este, profani!","Away, O away, you uninitiated!","退下，退下吧，未经启示之人！"],
  [6,261,"Tu ne cede malis, sed contra audentior ito.","Yield not to evils, but go more boldly against them.","不要屈服于邪恶，而要更勇敢地迎击。"],
  [6,376,"Desine fata deum flecti sperare precando.","Cease to hope that the gods' decrees can be bent by prayer.","不要指望祈祷能改变神的旨意。"],
  [6,429,"Quam vellent aethere in alto / nunc et pauperiem et duros perferre labores!","How they would wish now in the upper air to endure even poverty and hard toils!","他们在上方的空气中时，多么渴望忍受贫穷和艰苦的劳作！"],
  [6,440,"Quos durus amor crudeli tabe peredit.","Those whom harsh love consumed with cruel wasting.","被残酷的爱以凶狠的消磨吞噬的人们。"],
  [6,442,"Curae non ipsa in morte relinquunt.","Cares do not leave them even in death itself.","忧虑在死亡中也不曾离去。"],
  [6,460,"Invitus, regina, tuo de litore cessi.","Unwillingly, O queen, I departed from your shore.","女王啊，我离开你的海岸，并非出于自愿。"],
  [6,620,"Discite iustitiam moniti et non temnere divos.","Learn justice, being warned, and not to scorn the gods.","受此警示，学会公正，不要蔑视神明。"],
  [6,625,"Non, mihi si linguae centum sint oraque centum, / ferrea vox.","Not if I had a hundred tongues, a hundred mouths, and a voice of iron.","纵使我有百条舌头、百张嘴、铁铸的嗓音。"],
  [6,713,"Has omnis, ubi mille rotam volvere per annos, / Lethaeum ad fluvium deus evocat agmine magno.","All these, when they have turned the wheel through a thousand years, the god summons to the river Lethe in a great throng.","所有这些灵魂，在轮转千年之后，神以浩大的队列召唤他们前往忘川。"],
  [6,724,"Spiritus intus alit, totamque infusa per artus / mens agitat molem.","A spirit within sustains, and mind, infused through all the limbs, moves the whole mass.","内在的灵气滋养万物，流贯四肢的心智驱动整个形体。"],
  [6,726,"Igneus est ollis vigor et caelestis origo.","Theirs is a fiery vigour and a heavenly origin.","它们有着火焰般的活力与天堂的起源。"],
  [6,730,"Quisque suos patimur manes.","Each of us suffers their own shades.","我们每个人都承受着自己的幽灵。"],
  [6,806,"Excudent alii spirantia mollius aera, / credo equidem.","Others will hammer out bronzes that breathe more softly — I well believe it.","别人会铸造出更柔美的呼吸着的铜像——我完全相信。"],
  [6,847,"Tu regere imperio populos, Romane, memento.","You, Roman, remember to rule the peoples with authority.","罗马人啊，记住你要以权威统治万民。"],
  [6,851,"Parcere subiectis et debellare superbos.","To spare the conquered and war down the proud.","宽恕臣服者，击败骄傲者。"],
  [6,869,"Tu Marcellus eris. Manibus date lilia plenis.","You shall be Marcellus. Give lilies with full hands.","你将成为马尔凯卢斯。双手满捧百合花吧。"],
  [6,882,"Ostendent terris hunc tantum fata neque ultra / esse sinent.","The fates will but show him to the world, and not allow him to stay longer.","命运只让他在世间短暂显现，不许他停留更久。"],
  [6,893,"Sunt geminae Somni portae, quarum altera fertur / cornea, qua veris facilis datur exitus umbris.","There are twin gates of Sleep: one is said to be of horn, through which true shades pass easily.","睡眠有两扇门：一扇据说是角质的，真实的幽灵从那里轻易通过。"],

  // ——— BOOK VII: War in Latium ———
  [7,44,"Tu quoque litoribus nostris, Aeneia nutrix, / aeternam moriens famam, Caieta, dedisti.","You too, Caieta, nurse of Aeneas, gave eternal fame to our shores by dying.","你也给了我们海岸永恒的名声，卡耶塔——埃涅阿斯的乳母——以你的死。"],
  [7,96,"Ne pete conubiis natam sociare Latinis; / externi venient generi.","Do not seek to join your daughter in Latin marriage; foreign sons-in-law shall come.","不要将你的女儿许配给拉丁人；外来的女婿将到来。"],
  [7,203,"Sic fata deum rex sortitur volvitque vicissim.","So the king of gods allots and turns the fates in turn.","众神之王就这样分配命运，轮番翻转。"],
  [7,286,"Nulla fides regni sociis, omnisque potestas / impatiens consortis erit.","No trust among partners in power; all authority will be impatient of a partner.","权力的同盟中无信任可言；一切权柄都无法忍受分享。"],
  [7,312,"Flectere si nequeo superos, Acheronta movebo.","If I cannot bend the heavens, I shall move the underworld.","如果我无法撼动天上的神，我将搅动地狱。"],
  [7,572,"Luctus ubique pavor et plurima mortis imago.","Everywhere grief, everywhere dread, and death in many a form.","到处是悲痛，到处是恐惧，死亡以无数面孔现身。"],
  [7,594,"Quin etiam in silvas, simulato numine Bacchi, / maius adorta nefas maioremque orsa furorem.","She even took to the woods, feigning the power of Bacchus, daring greater sacrilege.","她甚至遁入丛林，假借酒神之力，敢于更大的亵渎。"],
  [7,601,"Nec face tantum / Cisseis praegnans ignis enixa iugalis: / sed non ante datum volvere casus.","This was not less than when the pregnant daughter of Cisseus bore a firebrand — but fate was not yet ready to turn.","这不亚于基修斯的女儿怀着火把生下婚姻之炎——但命运尚未准备好翻转。"],

  // ——— BOOK VIII: Alliance & the Shield ———
  [8,18,"Nec tu Tiberine, tuorum / oblitus recede fluens.","And you, Tiber, do not flow away, forgetting your people.","台伯河啊，不要遗忘你的子民而流走。"],
  [8,112,"Hunc illum poscere fata / et voce vocantem / volantem fama per agros.","This is the one fate demands, whom fame calls through the fields.","这就是命运要求的那个人，名声在田野间呼唤他飞来。"],
  [8,275,"Primus ab aetherio venit Saturnus Olympo.","First from heavenly Olympus came Saturn.","萨图尔努斯最先从天上的奥林匹斯降临。"],
  [8,313,"Haec nemora indigenae Fauni Nymphaeque tenebant, / gensque virum truncis et duro robore nata.","These groves were held by native Fauns and Nymphs, and a race of men born from tree trunks and hard oak.","这些林地曾属于本土的牧神和仙女们，以及从树干和坚硬的橡木中诞生的人类。"],
  [8,364,"Aude, hospes, contemnere opes et te quoque dignum / finge deo.","Dare, O guest, to scorn riches and make yourself also worthy of a god.","客人啊，敢于蔑视财富，也让自己配得上神的标准。"],
  [8,514,"Bella manu letumque gero.","War and death I carry in my hand.","我手中携带着战争与死亡。"],
  [8,560,"Stat sua cuique dies, breve et inreparabile tempus / omnibus est vitae.","Each has their appointed day; brief and irreparable is the span of life for all.","每个人都有注定的日子；生命的时光对所有人都是短暂且不可挽回的。"],
  [8,625,"Illic res Italas Romanorumque triumphos / non vatum ignarus venturique inscius aevi / fecerat ignipotens.","There the fire-lord, not ignorant of prophecy nor unknowing of the age to come, had wrought the story of Italy and Rome's triumphs.","在那里，火神——他并非不知预言，也并非不晓未来的时代——铸造了意大利的故事和罗马的凯旋。"],
  [8,731,"Attollens umero famamque et fata nepotum.","Lifting on his shoulder the fame and fate of his descendants.","他肩扛着后代的荣耀与命运。"],

  // ——— BOOK IX: Siege & Sacrifice ———
  [9,184,"Nisus ait: 'Dine hunc ardorem mentibus addunt, / Euryale, an sua cuique deus fit dira cupido?'","Nisus says: 'Do the gods put this fire in our minds, Euryalus, or does each person's fierce desire become their god?'","尼苏斯说：'是众神将这烈焰放入我们心中，欧律阿卢斯，还是每个人炽烈的渴望本身就成了他的神？'"],
  [9,205,"Nulla dies umquam memori vos eximet aevo.","No day shall ever erase you from the memory of time.","没有任何一天能将你们从时间的记忆中抹去。"],
  [9,281,"Fortunati ambo! Si quid mea carmina possunt, / nulla dies umquam memori vos eximet aevo.","Fortunate pair! If my songs have any power, no day shall ever erase you from the memory of time.","幸运的两人！如果我的诗歌有任何力量，没有任何一天能将你们从记忆中抹去。"],
  [9,314,"Macte nova virtute, puer, sic itur ad astra.","Bless your young valour, boy: so one goes to the stars.","愿你新生的勇气得到祝福，少年：这就是通往星辰的路。"],
  [9,427,"Volvitur Euryalus leto, pulchrosque per artus / it cruor.","Euryalus falls in death, and blood flows over his beautiful limbs.","欧律阿卢斯在死亡中倒下，鲜血流过他美丽的身体。"],
  [9,435,"Purpureus veluti cum flos succisus aratro / languescit moriens.","As when a purple flower, cut by the plough, droops and dies.","如同一朵紫色的花被犁铧割断，萎靡凋零。"],
  [9,446,"Tum caput ipsi aufert domino truncumque relinquit / sanguine singultantem.","Then he strikes the head from its master and leaves the trunk gasping with blood.","然后他砍下主人的头颅，留下躯干在血中抽搐。"],
  [9,641,"Audentes Fortuna iuvat.","Fortune favours the bold.","命运眷顾勇者。"],

  // ——— BOOK X: Council of Gods & Battle ———
  [10,11,"Abnueram bello Italiam concurrere Teucris.","I had forbidden Italy to clash in war with the Trojans.","我曾禁止意大利与特洛伊人开战。"],
  [10,100,"Rex Iuppiter omnibus idem. / Fata viam invenient.","King Jupiter is the same to all. The fates will find a way.","朱庇特王对所有人一视同仁。命运会找到它的路。"],
  [10,113,"Suo cuique reddetur labori.","Each shall be repaid according to their toil.","每个人将根据自己的劳作得到回报。"],
  [10,284,"Audentes Fortuna iuvat.","Fortune favours the bold.","命运眷顾勇者。"],
  [10,467,"Stat sua cuique dies, breve et inreparabile tempus / omnibus est vitae; sed famam extendere factis, / hoc virtutis opus.","Each has their appointed day; brief and irreparable is the span of life for all; but to extend fame by deeds — this is the work of valour.","每人都有注定之日；生命对所有人都短暂且不可追回——但以行动延伸名声——这是美德的事业。"],
  [10,501,"Nescia mens hominum fati sortisque futurae / et servare modum rebus sublata secundis!","The minds of men know not fate and future lot, nor how to keep measure when lifted by success!","人的心灵不懂命运和未来的安排，也不知在得意之时保持节制！"],
  [10,630,"Terga dabo et Turnum fugientem haec terra videbit?","Shall I turn my back and this land see Turnus fleeing?","我要转身逃跑，让这片土地看到图尔努斯在逃亡？"],
  [10,811,"Usque adeone mori miserum est?","Is dying really so wretched?","死亡真的如此可悲吗？"],
  [10,846,"Vitaque cum gemitu fugit indignata sub umbras.","And life with a groan fled indignant to the shades below.","生命带着一声叹息，愤然逃向幽冥。"],

  // ——— BOOK XI: Grief, Truce & Camilla ———
  [11,97,"Nos alias hinc ad lacrimas eadem horrida belli / fata vocant.","The same grim fates of war call us from here to other tears.","同样残酷的战争命运将我们从这里召唤向另一些泪水。"],
  [11,104,"Fato stat cuncta.","All things stand by fate.","一切都由命运决定。"],
  [11,159,"Nulla salus bello, pacem te poscimus omnes.","There is no safety in war; we all beg you for peace.","战争中没有安全；我们所有人都向你乞求和平。"],
  [11,176,"Sed periisse semel satis est.","But to have perished once is enough.","只要死过一次就够了。"],
  [11,302,"Non ego cum Danais Troianam exscindere gentem / Aulide iuravi.","I did not swear at Aulis with the Greeks to destroy the Trojan race.","我没有在奥利斯与希腊人一同起誓毁灭特洛伊人。"],
  [11,362,"Verum anceps pugnae fuerat fortuna.","But the fortune of battle had been uncertain.","但战斗的命运一直是不确定的。"],
  [11,508,"Bellum, O terra hospita, portas!","War, O hospitable land, you bring!","战争——你带来了战争，好客的土地啊！"],
  [11,725,"Nulla fugae ratio, nulla spes: undique Turnus / aderat.","No means of flight, no hope: on every side Turnus was there.","无路可逃，无望可寻：图尔努斯在四面八方。"],
  [11,831,"Vitam deo vivam sine crimine; tantum / me rapias per tela.","Let me live a life without blame for a god; only snatch me away through the weapons.","让我为神过一种无罪的生活；只要让我穿过刀锋被带走。"],

  // ——— BOOK XII: The Final Duel, Fate Resolved ———
  [12,45,"Usque adeone mori miserum est?","Is dying really so wretched?","死亡真的如此可悲吗？"],
  [12,97,"Vincet amor patriae laudumque immensa cupido.","Love of country and boundless desire for glory shall prevail.","对祖国的爱和对荣耀的无尽渴望将会胜出。"],
  [12,153,"Di nostra incepta secundent.","May the gods favour our undertaking.","愿众神庇佑我们的事业。"],
  [12,156,"Suo tempore visent.","They will see in their own time.","他们将在属于自己的时刻看到。"],
  [12,166,"Nulli exaudita deorum / vota precesque meae!","My vows and prayers heard by none of the gods!","我的祈愿和祷告无一被众神听见！"],
  [12,435,"Nec mortale sonans, adflata est numine quando / iam propiore dei.","Not sounding mortal, since she was breathed upon by the nearer power of a god.","她的声音不似凡人——因为更近的神力已吹拂了她。"],
  [12,646,"Exoriare aliquis nostris ex ossibus ultor!","Rise, some avenger, from our bones!","从我们的骨灰中升起吧，复仇者！"],
  [12,676,"Stat conferre manum Aeneae, stat quidquid acerbi est / morte pati.","My resolve is to face Aeneas in combat, to endure whatever bitterness death holds.","我决意与埃涅阿斯正面对决，承受死亡带来的一切苦痛。"],
  [12,727,"Iuppiter ipse duas aequato examine lances / sustinet et fata imponit diversa duorum.","Jupiter himself holds up the two scales in equal balance and places upon them the different fates of the two.","朱庇特亲自托起两端平衡的天平，将两人不同的命运放上去。"],
  [12,828,"Dabit ille fidem, tanta en praestantia formae.","He will keep faith — so great is the distinction of his form.","他会守信——如此卓越的风度可以证明。"],
  [12,894,"Sic ait, et scopulum magnum magno cum murmure tollit.","So he spoke, and with a great roar lifted a great boulder.","他这样说着，发出巨大的怒吼，举起一块巨石。"],
  [12,931,"Miseri te si qua parentis / tangere cura potest, oro.","If any care for your wretched father can touch you, I beg you.","如果对你不幸的父亲的一丝牵挂能触动你，我恳求你。"],
  [12,940,"Ulterius ne tende odiis.","Press your hatred no further.","不要再将你的仇恨推得更远了。"],
  [12,952,"Tune hinc spoliis indute meorum / eripiare mihi?","Shall you, clad in the spoils of my people, be snatched from me?","穿着我亲人甲胄的你，竟想从我手中逃脱？"],
  [12,951,"Pallas te hoc vulnere, Pallas / immolat et poenam scelerato ex sanguine sumit.","Pallas, Pallas strikes you with this wound, and exacts the penalty from your cursed blood.","帕拉斯，是帕拉斯用这一击伤你，从你有罪的血中索取惩罚。"],
  [12,952,"Vitaque cum gemitu fugit indignata sub umbras.","And life with a groan fled indignant to the shades below.","生命带着一声叹息，愤然逃向幽冥的阴影。"],

  // ——— ADDITIONAL ORACLES ———

  // Book I
  [1,257,"O qui res hominumque deumque / aeternis regis imperiis et fulmine terres.","O you who rule the affairs of men and gods with eternal authority, and terrify with your thunderbolt.","你以永恒的权威统治人与神的事务，以雷霆使万物战栗。"],
  [1,364,"Imperium Oceano, famam qui terminet astris.","Whose empire the Ocean bounds, whose fame the stars.","他的帝国以大洋为界，荣耀直达星辰。"],
  [1,378,"Sunt hic etiam sua praemia laudi.","Here too there are rewards for merit.","即使在这里，功绩也有它的回报。"],
  [1,543,"Sperate deos memores fandi atque nefandi.","Trust that the gods remember right and wrong.","相信众神记得何为正义、何为不义。"],
  [1,299,"Aspera tum positis mitescent saecula bellis.","Then harsh ages shall grow gentle, wars laid aside.","那时严酷的时代将变得温和，战争将被搁置。"],
  [1,291,"Nascetur pulchra Troianus origine Caesar.","From noble Trojan origin a Caesar shall be born.","从高贵的特洛伊血脉中，一位凯撒将诞生。"],
  [1,610,"O sola infandos Troiae miserata labores.","O you alone who pitied Troy's unspeakable suffering.","唯有你怜悯了特洛伊不可言说的苦难。"],
  [1,199,"O passi graviora; dabit deus his quoque finem.","O you who have endured worse; god will give an end to these as well.","承受过更重苦难的人啊；神也会给这一切一个终结。"],

  // Book II
  [2,12,"Sed si tantus amor casus cognoscere nostros.","But if so great a love to learn our misfortunes.","但如果你对了解我们的灾难有如此深切的渴望。"],
  [2,250,"Vertitur interea caelum et ruit Oceano nox.","Meanwhile the sky revolves and night rushes from the Ocean.","天穹转动，夜从大洋奔涌而来。"],
  [2,325,"Arma amens capio; nec sat rationis in armis.","Maddened, I seize arms — yet there is not enough reason in arms.","疯了一般，我抓起武器——然而武器中哪有足够的理智。"],
  [2,402,"Excessere omnes adytis arisque relictis / di quibus imperium hoc steterat.","All the gods by whose power this empire had stood departed, leaving shrines and altars.","所有曾支撑这帝国的神明都离去了，遗弃了神殿与祭坛。"],
  [2,535,"Natum ante ora patris, patrem qui obtruncat ad aras.","He who slaughters the son before the father's face, the father at the altars.","在父亲面前杀死儿子，在祭坛前杀死父亲的人。"],
  [2,660,"Non tali auxilio nec defensoribus istis / tempus eget.","The time does not call for such help nor such defenders.","现在需要的不是这样的帮助，也不是这样的守护者。"],
  [2,725,"Eripe, nate, fugam finemque impone labori.","Snatch your escape, my son, and put an end to this toil.","快逃吧，我的孩子，结束这场苦难。"],
  [2,750,"Nusquam abero et tutum patrio te limine sistam.","I shall never be far and will set you safe at your father's threshold.","我永远不会远离，会把你安全送到你父亲的门槛。"],

  // Book III
  [3,48,"Horrendum et dictu video mirabile monstrum.","I see a dreadful and wondrous portent.","我看到了一个可怖而奇异的征兆。"],
  [3,309,"Accipite ergo animis atque haec mea figite dicta.","Receive these words in your hearts and fix them there.","把这些话刻入你们的心中。"],
  [3,373,"Italiam primus conclamat Achates.","Achates is the first to cry out: Italy!","阿卡特斯第一个高呼：意大利！"],
  [3,395,"Multa bovis circa mactantur corpora Morti.","Many bodies of cattle are slain in offering to Death.","许多牛的躯体被宰杀，献祭给死亡。"],
  [3,477,"Vade age, et ingentem factis fer ad aethera Troiam.","Go now, and by your deeds carry great Troy to the heavens.","去吧，用你的行动将伟大的特洛伊带上苍穹。"],
  [3,395,"Nocte fugam taciti moliri et intendere vela.","In the night, to prepare flight in silence and spread the sails.","在黑夜中，悄悄地筹备逃亡，张开风帆。"],

  // Book IV
  [4,88,"Quid vota furentem, / quid delubra iuvant?","What use are vows to one in frenzy? What use are temples?","祈愿对疯狂之人有何用？神殿又有何益？"],
  [4,305,"Dissimulare etiam sperasti, perfide, tantum / posse nefas?","Did you hope, faithless one, that you could disguise so great a wrong?","你以为你能掩盖这么大的罪过吗，背信的人？"],
  [4,408,"Improbe Amor, quid non mortalia pectora cogis!","Cruel Love, to what do you not drive mortal hearts!","残酷的爱神，你不驱使凡人的心走向何处！"],
  [4,522,"Nox erat et placidum carpebant fessa soporem / corpora per terras.","It was night, and weary bodies throughout the lands were enjoying peaceful sleep.","夜了，疲惫的身躯在大地上享受着宁静的睡眠。"],
  [4,563,"Omnibus umbra locis adero. Dabis, improbe, poenas.","My shade shall be present everywhere. You shall pay, wretch.","我的幽灵将在所有地方出现。你将付出代价，无耻之人。"],
  [4,651,"Felix, heu nimium felix, si litora tantum / numquam Dardaniae tetigissent nostra carinae!","Happy, alas too happy, if only Dardan keels had never touched our shores!","幸福啊，可叹太过幸福，只要达达尼亚的船从未触碰我们的海岸！"],
  [4,331,"Ego te, quae plurima fando / enumerare vales, numquam, regina, negabo / promeritam.","I shall never deny, O queen, that you deserve all you can list in words.","女王，我绝不否认，你值得你所能列举的一切。"],
  [4,440,"Si bene quid de te merui, fuit aut tibi quicquam / dulce meum.","If I have deserved well of you, or if anything of mine was ever sweet to you.","如果我曾对你有过任何功劳，或者我的任何东西曾让你感到甜蜜。"],
  [4,478,"Testatur moritura deos et conscia fati / sidera.","Dying, she calls to witness the gods and the stars that know her fate.","将死之人呼唤众神和知晓她命运的星辰作证。"],

  // Book V
  [5,304,"Nec quisquam aeratas acies ex agmine tanto / audet adire virum.","No one from so great a host dares to face the man in bronze armour.","在如此庞大的军队中，无人敢面对那穿铜甲的人。"],
  [5,467,"Non iam certamine summo, / sed pro vita extrema.","No longer for the highest prize, but for very life.","不再为最高的荣誉，而是为了活下去。"],
  [5,604,"O nimium caelo et pelago confise sereno!","O you who trusted too much in clear sky and calm sea!","你太过信赖晴朗的天空与平静的海面了！"],
  [5,700,"Nate, mihi quondam vita dulcior, / Iliacis exercite fatis.","Son, once sweeter to me than life, tested by Trojan fates.","孩子啊，曾比生命更甜蜜，被特洛伊的命运反复磨练。"],
  [5,456,"Magna coronarum praemia tollere iussit.","He commanded them to take away the great prizes of the crowns.","他命令他们拿走那些伟大的桂冠奖赏。"],
  [5,853,"Nimium vobis Romana propago / visa potens.","Too powerful to you seemed Roman progeny.","罗马的后裔在你们看来太过强大了。"],

  // Book VI
  [6,86,"Bella, horrida bella, / et Thybrim multo spumantem sanguine cerno.","Wars, horrible wars, and the Tiber foaming with much blood I see.","战争，可怖的战争，我看见台伯河泛着鲜血的泡沫。"],
  [6,14,"Non hoc ista sibi tempus spectacula poscit.","This moment does not call for such spectacles.","这一刻不需要这样的景象。"],
  [6,268,"Ibant obscuri sola sub nocte per umbram.","They walked in darkness beneath the lonely night, through shadow.","他们在孤独的夜色下穿行于黑暗之中，穿过阴影。"],
  [6,309,"Tendebantque manus ripae ulterioris amore.","They stretched their hands in longing for the farther shore.","他们伸出双手，渴望着彼岸。"],
  [6,472,"Illa solo fixos oculos aversa tenebat.","She, turned away, kept her eyes fixed on the ground.","她转过身去，双眼紧盯着地面。"],
  [6,756,"Nunc age, Dardaniam prolem quae deinde sequatur / gloria.","Come now, see what glory shall attend the Dardan line.","来吧，看达达尼亚的后裔将获得怎样的荣耀。"],
  [6,791,"Hic vir, hic est, tibi quem promitti saepius audis.","This, this is the man whom you so often hear promised to you.","这个人，这就是你时常听到被许诺给你的那个人。"],
  [6,833,"Quis te, magne Cato, tacitum aut te, Cosse, relinquat?","Who could pass you by in silence, great Cato, or you, Cossus?","谁能默默略过你，伟大的加图，或者你，科苏斯？"],
  [6,126,"Troius Aeneas, pietate insignis et armis.","Trojan Aeneas, distinguished in devotion and in arms.","特洛伊的埃涅阿斯，以虔诚和武力闻名。"],

  // Book VII
  [7,37,"Maius opus moveo.","I embark on a greater work.","我启动一项更宏大的事业。"],
  [7,45,"Tu vatem, tu, diva, mone; dicam horrida bella.","You, goddess, instruct the prophet; I shall tell of horrible wars.","女神啊，你来指引预言者；我将讲述可怖的战争。"],
  [7,170,"Laurus erat tecti medio in penetralibus altis.","A laurel stood in the midst of the house, in the high inner chamber.","一棵月桂树矗立在宫殿深处的高堂之中。"],
  [7,255,"Tum satus Anchisa delectos ordine ab omni / centum oratores augusta ad moenia regis / ire iubet.","Then the son of Anchises commands a hundred chosen envoys to go to the august walls of the king.","安基塞斯之子命令一百名精选的使者前往国王庄严的城墙。"],
  [7,580,"Quis deus in fraudem, quae dura potentia nostra / egit?","What god, what harsh power drove us to treachery?","什么神、什么残酷的力量驱使我们走向欺诈？"],

  // Book VIII
  [8,131,"Haud incerta cano.","Not uncertain things I sing.","我所歌唱的，不是不确定之事。"],
  [8,362,"Iam tum religio pavidos terrebat agrestis.","Already then religion terrified the fearful rustics.","那时候宗教就已经令胆怯的乡民恐惧了。"],
  [8,441,"Tu, nubibus actis, / dividis et socios.","You, driving the clouds, divide even companions.","你驱散乌云，却也将同伴分离。"],
  [8,520,"Iamque adeo scopulos Sirenum advecta subibat.","And now she was passing beneath the cliffs of the Sirens.","此刻她正从塞壬的岩石下驶过。"],

  // Book IX
  [9,311,"Est hic, est animus lucis contemptor et istum / qui vita bene credat emi, quo tendis, honorem.","Here, here is a spirit that scorns the light, and believes that honour you seek is cheaply bought with life.","这里有一颗蔑视光明的心灵，相信你所追求的荣誉用生命来换是划算的。"],
  [9,601,"En, age, si qua animo virtus, et consere dextram.","Come, if there is any courage in your heart, and match me hand to hand.","来吧，如果你心中还有勇气，就与我交手。"],
  [9,140,"Nusquam amittet oculos; sub nocte tegetur.","She will never lose sight of them; she will be hidden by the night.","她永远不会移开目光；她将被夜色掩护。"],
  [9,485,"At non Euryalum referent tua dicta parentem.","But your words shall not bring back Euryalus to his mother.","但你的话不能把欧律阿卢斯带回他母亲身边。"],

  // Book X
  [10,440,"Tum genitor natum dictis adfatur amicis.","Then the father addresses his son with friendly words.","然后父亲用温和的话语对儿子说。"],
  [10,773,"I, decus, i, nostrum; melioribus utere fatis.","Go, my glory, go; enjoy better fates.","去吧，我的荣耀，去吧；去享受更好的命运。"],
  [10,791,"Nescia mens hominum fati sortisque futurae.","The mind of man knows not fate or future lot.","人的心灵不懂命运与未来的安排。"],
  [10,524,"Nescit longius ire dolor.","Grief knows no further going.","悲痛已经无法更深了。"],
  [10,374,"Hunc ego te, Evandre, aspicio? Haecine dona reporto?","Is this you I behold, Evander? Are these the gifts I bring back?","这就是我带回来的你吗，伊万德尔？这就是我带回的礼物吗？"],

  // Book XI
  [11,139,"Parcite me fatis debitam eripere.","Spare me — do not snatch one owed to fate.","饶了我——不要把命运注定的人夺走。"],
  [11,371,"Multa dies variusque labor mutabilis aevi / rettulit in melius.","Many a day and the varied toil of changing time has turned things for the better.","漫长的岁月和变幻的时代以千般劳作，把事情变得更好。"],
  [11,425,"Cedit item retro, simul hunc fuga nuda patescit.","He also yields ground, the moment bare flight opens up.","当赤裸的逃路敞开的那一刻，他也向后退去。"],
  [11,441,"Usque adeo turbatur agris.","So greatly are the fields thrown into turmoil.","田野被搅动到如此地步。"],
  [11,688,"Ornatus Argivae Helenae quos illa Mycenis / advexit.","The ornaments of Argive Helen, which she brought from Mycenae.","来自迈锡尼的阿尔戈斯海伦的饰物。"],

  // Book XII
  [12,229,"Fas et iura sinunt; nostra haud diffidite laudi.","Right and law permit it; do not mistrust our valour.","正义与法律允许此事；不要怀疑我们的勇气。"],
  [12,503,"Iamque adeo super unus eram.","And now I alone survived.","此刻只剩下我一个人了。"],
  [12,572,"Nec plura effatus saxum circumspicit ingens.","Saying no more, he looks around for a huge boulder.","他不再多说，四处张望寻找一块巨石。"],
  [12,764,"Di Iovis in tectis iram miserantur inanem / amborum et tantos mortalibus esse labores.","The gods in Jupiter's halls pity the vain rage of both and that mortals have such great toils.","朱庇特殿堂中的众神怜悯两人徒劳的愤怒，叹息凡人竟有如此沉重的磨难。"],
  [12,435,"Non mortale sonans; maiora iam volvere casus.","Not sounding mortal; already greater events were turning.","声音不似凡人；更宏大的变局已在翻转。"],

  // ——— EXPANSION: 冥府重点扩充 + 全篇补充 ———

  // ··· Book I ···
  [1,118,"Eripiunt subito nubes caelumque diemque / Teucrorum ex oculis.","Suddenly clouds snatch away both sky and daylight from the Trojans' eyes.","乌云骤然从特洛伊人眼前夺走了天空与白昼。"],
  [1,155,"Sic ait, et dicto citius tumida aequora placat.","So he spoke, and swifter than his word he calms the swelling seas.","他话音未落，翻涌的海面已被平息。"],
  [1,421,"Miratur molem Aeneas, magalia quondam.","Aeneas marvels at the mass of buildings, once mere huts.","埃涅阿斯惊叹于这宏伟建筑——曾经只是简陋的棚屋。"],
  [1,437,"O fortunati, quorum iam moenia surgunt!","O fortunate ones, whose walls already rise!","幸运的人啊，你们的城墙已经矗立！"],
  [1,460,"Quae regio in terris nostri non plena laboris?","What region of the earth is not full of our toil?","大地上哪个角落没有我们苦难的痕迹？"],
  [1,461,"Animum pictura pascit inani, / multa gemens.","He feeds his soul on the empty picture, groaning deeply.","他注视着空洞的画像，深深叹息，以此喂养灵魂。"],
  [1,328,"O dea, si prima repetens ab origine pergam.","O goddess, if I should trace the story from its very beginning.","女神啊，如果要从最初的起源开始讲起。"],
  [1,664,"Longa tibi exsilia et vastum maris aequor arandum.","Long exile awaits you, and a vast expanse of sea to plough.","漫长的流放在等着你，还有浩瀚的海面要犁过。"],

  // ··· Book II ···
  [2,199,"Scinditur incertum studia in contraria vulgus.","The uncertain crowd is split into opposing factions.","犹豫不决的人群分裂成对立的阵营。"],
  [2,68,"Laocoön ardens summa decurrit ab arce.","Laocoön, burning with passion, runs down from the citadel's height.","拉奥孔满腔激愤，从城堡的最高处奔跑而下。"],
  [2,310,"Tempus erat; placidumque petebant corpora somnum.","It was the hour; weary bodies sought peaceful sleep.","那是肉体寻求宁静睡眠的时辰。"],
  [2,348,"Arma, viri, ferte arma; vocat lux ultima victos.","Arms, men, bring arms! The final dawn calls the conquered.","武器，拿武器来！最后的曙光在召唤战败者。"],
  [2,728,"Iamque vale et nati serva communis amorem.","Now farewell, and preserve the love of our shared child.","如今别了，请守护我们共同的孩子的爱。"],
  [2,738,"Nequiquam ingeminans iterumque iterumque vocavi.","In vain, again and again I called.","一遍又一遍地呼唤——终归是徒劳。"],
  [2,426,"Cadit et Ripheus, iustissimus unus / qui fuit in Teucris et servantissimus aequi.","Falls too Ripheus, the most just man among the Trojans and the most observant of right.","里菲乌斯也倒下了——特洛伊人中最正义、最恪守公道的人。"],

  // ··· Book III ···
  [3,129,"Effigiem Xanthi Troiamque videtis / quam vestrae fecere manus.","You see an image of Xanthus and a Troy your own hands have built.","你们看到了桑图斯河的影像和你们亲手建造的特洛伊。"],
  [3,282,"Di, prohibete minas; di, talem avertite casum!","Gods, ward off these threats; gods, turn aside such doom!","众神啊，消弭这些威胁！众神啊，转开这样的厄运！"],
  [3,192,"Dare fatis vela iubebat.","He bade us give our sails to the fates.","他命令我们把风帆交给命运。"],
  [3,495,"Nos alia ex aliis in fata vocamur.","We are called from one fate to another.","我们被从一个命运召唤向另一个命运。"],
  [3,718,"Heu genitorem, omnis curae casusque levamen, / amitto Anchisen.","Alas, I lose my father Anchises — solace of every care and trouble.","我失去了父亲安基塞斯——一切忧虑与苦难的慰藉。"],

  // ··· Book IV ···
  [4,1,"At regina gravi iamdudum saucia cura / vulnus alit venis et caeco carpitur igni.","But the queen, long since smitten with a heavy ache, feeds the wound with her lifeblood and is consumed by a hidden fire.","但女王早已被沉重的忧思所伤，以心血供养伤口，被暗火吞噬。"],
  [4,9,"Anna soror, quae me suspensam insomnia terrent!","Anna, sister, what dreams terrify me in my suspense!","安娜姐姐，什么样的梦在惶恐中折磨着我！"],
  [4,169,"Ille dies primus leti primusque malorum / causa fuit.","That day was the first cause of death and the first of evils.","那一天是死亡最初的缘由，也是一切灾祸的开端。"],
  [4,173,"Speluncam Dido dux et Troianus eandem / deveniunt.","Dido and the Trojan leader come to the same cave.","狄多与特洛伊的首领走进了同一个洞穴。"],
  [4,365,"Nec te noster amor nec te data dextera quondam / nec moritura tenet crudelis funere Dido?","Does neither our love hold you, nor the hand once given, nor Dido about to die a cruel death?","我们的爱留不住你？曾经的誓言留不住你？即将惨死的狄多也留不住你？"],
  [4,381,"I, sequere Italiam ventis, pete regna per undas.","Go, pursue Italy on the winds, seek your kingdom through the waves.","去吧，乘风追逐意大利，穿越波浪寻找你的王国。"],
  [4,270,"Heia age, rumpe moras.","Come, break through all delay.","来吧，打破一切迟疑。"],

  // ··· Book V ···
  [5,49,"Annuus exactis completur mensibus orbis.","The yearly circle of months is complete.","一年的月份轮转已满。"],
  [5,620,"Quis furor iste novus? Quo nunc, quo tenditis?","What new madness is this? Where now, where do you aim?","这是什么新的疯狂？你们现在要去哪里？"],
  [5,616,"Heu nihil invitis fas quemquam fidere divis!","Alas, no one may trust in anything when the gods are unwilling!","唉，当众神不情愿时，没有人敢信赖任何事！"],

  // ··· Book VI: 冥府 — MAJOR EXPANSION ···
  [6,45,"Phoebe, gravis Troiae semper miserate labores.","Phoebus, you who always pitied Troy's grievous sufferings.","福玻斯啊，你总是怜悯特洛伊沉重的苦难。"],
  [6,51,"Da propriam, Thymbraee, domum; da moenia fessis.","Grant us our own home, Thymbraean god; grant walls to the weary.","提姆布拉之神啊，赐予我们自己的家园；赐予疲惫之人城墙。"],
  [6,77,"Poscere fata / tempus, ait; deus, ecce, deus!","It is time to ask the fates, she cried — the god, behold, the god!","她喊道：是时候求问命运了——神来了，看啊，神来了！"],
  [6,133,"Si potuit manis accersere coniugis Orpheus.","If Orpheus could summon the shade of his wife.","如果俄耳甫斯能召唤他妻子的幽灵。"],
  [6,148,"Si te nulla movet tantae pietatis imago.","If no image of such great devotion moves you.","如果如此深切的虔诚都无法打动你。"],
  [6,156,"Primo avulso non deficit alter / aureus, et simili frondescit virga metallo.","When the first is torn away, a second golden bough grows, and the twig sprouts with the same metal.","第一根被折下，第二根金枝便生长出来，嫩枝以同样的金属发芽。"],
  [6,179,"Itur in antiquam silvam, stabula alta ferarum.","They enter the ancient forest, deep lairs of wild beasts.","他们走进古老的森林，野兽深邃的巢穴。"],
  [6,212,"Tum iussa Sibyllae, / haud mora, festinant flentes.","Then at the Sibyl's command, without delay, they hasten, weeping.","按照西比尔的命令，他们毫不迟疑地行动，一边流泪一边匆匆赶路。"],
  [6,237,"Di, quibus imperium est animarum, umbraeque silentes.","Gods who hold dominion over spirits, and you, silent shades.","统治灵魂的诸神啊，还有你们，沉默的幽灵。"],
  [6,264,"Vestibulum ante ipsum primisque in faucibus Orci / Luctus et ultrices posuere cubilia Curae.","Before the vestibule, in the very jaws of Orcus, Grief and avenging Cares have made their beds.","在地狱入口之前，在奥尔库斯的咽喉处，悲痛和复仇的忧虑安设了巢穴。"],
  [6,273,"Pallentesque habitant Morbi tristisque Senectus, / et Metus et malesuada Fames ac turpis Egestas.","Pale Diseases dwell there, and sad Old Age, and Fear, and ill-counselling Hunger, and vile Want.","苍白的疾病住在那里，还有悲伤的衰老、恐惧、唆人作恶的饥饿和卑鄙的贫穷。"],
  [6,282,"In medio ramos annosaque bracchia pandit / ulmus opaca, ingens.","In the midst a dark, vast elm spreads its ancient boughs.","一棵幽暗巨大的榆树在中央展开它年迈的枝桠。"],
  [6,298,"Portitor has horrendus aquas et flumina servat / terribili squalore Charon.","A dread ferryman guards these waters — Charon, of terrible filth.","一位可怖的摆渡人守护着这些水域——卡戎，满身骇人的污垢。"],
  [6,305,"Huc omnis turba ad ripas effusa ruebat.","All the crowd rushed, pouring toward the banks.","所有的灵魂如潮水般涌向河岸。"],
  [6,322,"Nec ripas datur horrendas nec rauca fluenta / transportare prius quam sedibus ossa quierunt.","They may not cross the dread banks or hoarse waters until their bones have found rest.","在骸骨找到安息之所之前，他们不被允许渡过那骇人的河岸。"],
  [6,371,"Quod te per caeli iucundum lumen et auras, / per genitorem oro, per spes surgentis Iuli.","By heaven's sweet light and air, by your father, by your hopes for rising Iulus — I beg you.","以天堂甜美的光芒和空气起誓，以你的父亲，以你对尤卢斯成长的希望——我恳求你。"],
  [6,384,"Cerberus haec ingens latratu regna trifauci / personat.","Huge Cerberus makes these realms ring with his triple-throated barking.","巨大的刻耳柏洛斯以三张嘴的吠叫震响了这片领域。"],
  [6,417,"Continuo auditae voces vagitus et ingens / infantumque animae flentes in limine primo.","At once voices were heard, a great wailing — the souls of infants weeping at the first threshold.","立刻传来哭声和巨大的啼嚎——婴儿的灵魂在最初的门槛上哭泣。"],
  [6,426,"Proxima deinde tenent maesti loca, qui sibi letum / insontes peperere manu.","Next, those who, guiltless, dealt themselves death with their own hand hold the mournful places.","接下来，那些无罪却亲手结束自己生命的人占据着哀伤之地。"],
  [6,450,"Inter quas Phoenissa recens a vulnere Dido / errabat silva in magna.","Among them Phoenician Dido, fresh from her wound, wandered in the great forest.","在她们之中，腓尼基的狄多带着新鲜的伤口，在巨大的森林里徘徊。"],
  [6,456,"Funeris heu tibi causa fui?","Was I, alas, the cause of your death?","唉，我竟是你死亡的原因吗？"],
  [6,469,"Quem fugis? Extremum fato quod te adloquor hoc est.","Whom do you flee? This is the last word fate allows me to speak to you.","你在逃避谁？这是命运允许我对你说的最后的话。"],
  [6,475,"Tandem corripuit sese atque inimica refugit / in nemus umbriferum.","At last she tore herself away and fled, hostile, into the shadowy grove.","她终于挣脱身去，怀着敌意逃入幽暗的树林。"],
  [6,535,"Hic locus est, partis ubi se via findit in ambas.","Here is the place where the road divides into two paths.","这就是道路分成两条的地方。"],
  [6,555,"Tisiphone sedens, palla succincta cruenta, / vestibulum exsomnis servat noctesque diesque.","Tisiphone, girt in a bloody robe, guards the vestibule sleepless, night and day.","提西福涅束着血衣，不眠不休地日夜守卫着入口。"],
  [6,617,"Vendidit hic auro patriam dominumque potentem / imposuit.","This one sold his country for gold and set a tyrant over it.","这个人把祖国卖了金子，把暴君强加于它之上。"],
  [6,637,"Devenere locos laetos et amoena virecta / fortunatorum nemorum sedesque beatas.","They came to joyful places and pleasant green meadows — the blessed groves and happy abodes.","他们来到欢乐之地、宜人的绿色草地——幸福的林间与安乐的居所。"],
  [6,640,"Largior hic campos aether et lumine vestit / purpureo.","Here a more generous sky clothes the fields in purple light.","这里更慷慨的苍穹以紫色的光芒为田野披上衣裳。"],
  [6,660,"Quique pii vates et Phoebo digna locuti.","Devoted poets who spoke things worthy of Phoebus.","虔诚的诗人们，他们说出了配得上福玻斯的话语。"],
  [6,662,"Inventas aut qui vitam excoluere per artis.","Or those who improved life through discovered arts.","或是那些通过发明的技艺改善了生活的人。"],
  [6,664,"Quique sui memores aliquos fecere merendo.","Those who by their merit made others remember them.","以及凭自己的功绩让他人铭记的人们。"],
  [6,687,"Venisti tandem, tuaque exspectata parenti / vicit iter durum pietas?","You have come at last! Has your devotion, awaited by your father, conquered the hard journey?","你终于来了！你的虔诚——父亲一直期盼的——战胜了这段艰难的旅途？"],
  [6,695,"Ter conatus ibi collo dare bracchia circum; / ter frustra comprensa manus effugit imago.","Three times he tried to throw his arms around his neck; three times the shade escaped his vain embrace.","三次他试图伸臂环抱父亲的脖颈；三次幽影从他徒劳的拥抱中逃脱。"],
  [6,703,"Animae quibus altera fato / corpora debentur, Lethaei ad fluminis undam / securos latices et longa oblivia potant.","Souls to whom second bodies are owed by fate drink carefree waters and long forgetfulness at the river of Lethe.","命中注定要重获肉身的灵魂们，在忘川之河畔饮下无忧的水和漫长的遗忘。"],
  [6,719,"Hinc metuunt cupiuntque, dolent gaudentque.","Hence they fear and desire, grieve and rejoice.","因此他们恐惧又渴望，悲痛又欢喜。"],
  [6,733,"Ergo exercentur poenis veterumque malorum / supplicia expendunt.","So they are disciplined by punishments and pay the penalties of old sins.","于是他们在惩罚中受磨练，偿还旧日罪孽的代价。"],
  [6,743,"Aliae panduntur inanes / suspensae ad ventos.","Some are hung, spread empty to the winds.","一些灵魂被悬挂在风中，空荡地展开。"],
  [6,853,"Hae tibi erunt artes; pacique imponere morem.","These shall be your arts: to impose the ways of peace.","这些将是你的技艺：为和平定下规矩。"],
  [6,871,"Heu, miserande puer, si qua fata aspera rumpas!","Alas, pitiable boy, if only you could break your harsh fates!","可叹可怜的少年啊，但愿你能冲破严酷的命运！"],

  // ··· Book VII ···
  [7,100,"Est locus, Hesperiam Grai cognomine dicunt.","There is a land the Greeks call Hesperia.","有一片土地——希腊人称之为赫斯珀里亚。"],
  [7,461,"Heu stirpem invisam et fatis contraria nostris / fata Phrygum!","Alas, the hated race, and Phrygian fates opposed to ours!","可恨的种族啊，弗里吉亚人的命运与我们势不两立！"],
  [7,641,"Pandite nunc Helicona, deae, cantusque movete.","Open now Helicon, O goddesses, and stir your songs.","女神们，现在打开赫利孔山吧，唤起你们的歌声。"],
  [7,808,"Bellatrix, non illa colo calathisve Minervae / femineas adsueta manus.","A warrior woman — her womanly hands unaccustomed to Minerva's distaff or wool baskets.","一位女战士——她女性的双手不习惯弥涅尔瓦的纺锤和毛线篮。"],
  [7,309,"Saevit amor ferri et scelerata insania belli.","The love of the sword rages, and the wicked madness of war.","对刀剑的渴望在燃烧，战争的疯狂邪念在肆虐。"],

  // ··· Book VIII ···
  [8,68,"Nate dea, quae nunc animo sententia surgit?","Son of a goddess, what intention now rises in your mind?","女神之子啊，此刻你心中涌起什么想法？"],
  [8,596,"O mihi praeteritos referat si Iuppiter annos!","O if Jupiter would bring back my bygone years!","但愿朱庇特把我逝去的年华还给我！"],
  [8,42,"O sate gente deum, Troianam ex hostibus urbem / qui revehis nobis.","O you born of the race of gods, who bring back the Trojan city to us from the enemy.","诸神血脉的后裔啊，你从敌人手中为我们带回特洛伊之城。"],
  [8,374,"Iamque dies alterque dies processit, et omnis / consumpta est aetas.","And now one day after another passed, and all the time was spent.","日子一天一天地过去，所有的时光都耗尽了。"],

  // ··· Book IX ···
  [9,5,"Turne, quod optanti divum promittere nemo / auderet, volvenda dies en attulit ultro.","Turnus, what no god would dare promise to one who prayed — the turning day has brought of its own accord.","图尔努斯，即使有人祈求也没有神灵敢许诺的——命运之轮自己带来了。"],
  [9,252,"Si fortuna permittit, abile matri / miserate refer.","If fortune permits, return this message in pity to my mother.","如果命运允许，请怜悯地把消息带给我的母亲。"],
  [9,617,"Caedicus Alcathoum obtruncat, Sacrator Hydaspem.","Caedicus strikes down Alcathous, Sacrator fells Hydaspes.","卡埃迪库斯斩倒阿尔卡托乌斯，萨克拉托尔砍倒许达斯佩斯。"],

  // ··· Book X ···
  [10,507,"O dolor atque decus magnum rediture parenti!","O grief and great glory, about to return to your father!","悲痛啊，即将带给父亲的巨大荣耀与哀伤！"],
  [10,821,"Olli dura quies oculos et ferreus urget / somnus; in aeternam clauduntur lumina noctem.","Hard rest weighs on his eyes, and iron sleep; his eyes close in everlasting night.","沉重的安息压上他的双眼，铁铸的睡眠降临；双目在无尽的黑夜中永远闭合。"],
  [10,449,"Sic Pater ille deum faciat, sic altus Apollo.","So may the father of the gods decree, so may lofty Apollo.","但愿众神之父这样决定，但愿高贵的阿波罗如此。"],

  // ··· Book XI ···
  [11,29,"Salve aeternum mihi, maxime Palla, / aeternumque vale.","Hail forever, greatest Pallas, and farewell forever.","永远安好，最伟大的帕拉斯，永远再见。"],
  [11,843,"Vitam pro laude pacisci.","To barter life for glory.","以生命换取荣耀。"],
  [11,252,"O fama ingens, ingentior armis, / vir Troiane.","O man of mighty fame, mightier still in arms, Trojan hero.","名声浩大、武力更加伟岸的特洛伊英雄啊。"],

  // ··· Book XII ···
  [12,56,"Tu spes, tu sola senectae / portus.","You are the hope, you alone the harbour of old age.","你是希望，你是暮年唯一的港湾。"],
  [12,872,"Fata obstant, placidasque viri deus obstruit auris.","The fates stand in the way, and a god blocks the hero's willing ears.","命运横亘在前，神灵堵住了英雄的双耳。"],
  [12,908,"Aeneas instat contra telumque coruscat / ingens arboreum.","Aeneas presses on, brandishing a huge spear like a tree.","埃涅阿斯步步紧逼，挥舞着一支如树般巨大的长矛。"],
  [12,19,"Nulla mora in Turno.","No delay in Turnus.","图尔努斯毫不迟疑。"],

  // ——— EXPANSION II: 目标 666 ———

  // ··· Book I: 风暴与迦太基 ···
  [1,8,"Albanique patres, atque altae moenia Romae.","The Alban fathers and the walls of lofty Rome.","阿尔巴的先祖们，以及高耸的罗马城墙。"],
  [1,37,"Necdum etiam causae irarum saevique dolores / exciderant animo.","Not yet had the causes of her rage and bitter pangs faded from her mind.","她心中那愤怒的缘由和刻骨的痛楚尚未消退。"],
  [1,65,"Ni faciat, maria ac terras caelumque profundum / quippe ferant rapidi secum verrantque per auras.","Were he not to do so, seas and lands and the deep sky would surely be swept away.","若非如此，大海、大地和深邃的天空都将被狂风席卷而去。"],
  [1,81,"O Aeole — namque tibi divum pater atque hominum rex / et mulcere dedit fluctus et tollere vento.","O Aeolus — for the father of gods and king of men gave you power both to calm and raise the waves.","埃俄罗斯啊——众神之父、人类之王赐予了你平息和掀起波浪的力量。"],
  [1,92,"Talia iactanti stridens Aquilone procella / velum adversa ferit.","As he cried such words, a howling storm struck the sails head-on.","正当他呼喊之时，一阵北风怒号的暴风迎面撕裂了船帆。"],
  [1,105,"Franguntur remi; tum prora avertit et undis / dat latus.","Oars are shattered; then the prow swings and exposes the broadside to the waves.","船桨断裂；船头偏转，将侧身暴露在波浪之中。"],
  [1,124,"Apparent rari nantes in gurgite vasto.","A few appear swimming in the vast abyss.","在浩瀚的深渊中，稀疏的身影在水面挣扎。"],
  [1,142,"Sic cunctus pelagi cecidit fragor, aequora postquam / prospiciens genitor.","So fell all the roar of the sea, after the father looked out upon the waters.","海洋的一切怒号都平息了——在父神俯瞰水面之后。"],
  [1,148,"Et iam finis erat, cum Iuppiter aethere summo / despiciens mare velivolum.","And now the end was near, when Jupiter from the height of heaven looked down upon the sail-winged sea.","终结将至——朱庇特从苍穹之巅俯视着帆影点点的大海。"],
  [1,208,"Tres litore cervos / prospicit errantis.","He spies three stags wandering on the shore.","他望见三头鹿在岸边徘徊。"],
  [1,305,"Volucremque fuga praevertitur Hebrum.","She outstrips in flight the swift river Hebrus.","她在奔跑中超越了湍急的赫布鲁斯河。"],
  [1,314,"Obstipuit primo aspectu Sidonia Dido.","Sidonian Dido was struck dumb at first sight.","西顿的狄多在初见之时目瞪口呆。"],
  [1,335,"Nulla tuarum audita mihi neque visa sororum.","None of your sisters have I heard or seen.","我既未听到也未见到你的任何姐妹。"],
  [1,411,"Iuvat ire et Dorica castra / desertosque videre locos litusque relictum.","It is a joy to go and see the Doric camps, the deserted sites, the abandoned shore.","去看那多利安的营地、荒废的遗址和被弃的海岸，是一种慰藉。"],
  [1,502,"Regina ad templum, forma pulcherrima Dido, / incessit.","To the temple came the queen, Dido, most beautiful in form.","女王狄多——容颜最为美丽——迈步走向神殿。"],
  [1,588,"Coram, quem quaeritis, adsum, / Troius Aeneas.","Before you in person, he whom you seek — I am here, Trojan Aeneas.","你们寻找的人就在眼前——我就是特洛伊的埃涅阿斯。"],
  [1,595,"Quis te, nate dea, per tanta pericula casus / insequitur?","What fate pursues you, goddess-born, through such great perils?","女神之子啊，什么命运追逐你穿越如此巨大的险境？"],
  [1,630,"Iustitia gentem docuit.","She taught her people justice.","她教导子民何为正义。"],

  // ··· Book II: 特洛伊的陷落 ···
  [2,10,"Et iam nox umida caelo / praecipitat suadentque cadentia sidera somnos.","And now dewy night falls from the sky, and the setting stars counsel sleep.","湿润的夜从天空坠落，沉落的星辰劝人入眠。"],
  [2,21,"Fracti bello fatisque repulsi / ductores Danaum, tot iam labentibus annis.","The Greek leaders, broken in war and repulsed by the fates, so many years now slipping by.","希腊的统帅们，在战争中被击溃、被命运拒绝——这么多年就这样流逝了。"],
  [2,40,"Aut aliquis latet error; equo ne credite, Teucri.","Some treachery lies hidden; do not trust the horse, Trojans.","某种诡计藏在其中；不要相信这匹马，特洛伊人。"],
  [2,65,"Scelus expendisse merentem.","One who deserved to pay for wickedness.","一个理应为罪行付出代价的人。"],
  [2,100,"Talibus insidiis periurique arte Sinonis / credita res.","By such treachery and the art of perjured Sinon the tale was believed.","凭借这般诡计和背誓的西农的手段，这故事被相信了。"],
  [2,145,"Hinc populum late regem belloque superbum / venturum excidio Libyae.","From here a people, ruling far and proud in war, would come to destroy Libya.","从这里将诞生一个统治广袤疆域、征战骄傲的民族，来毁灭利比亚。"],
  [2,199,"Scinditur incertum studia in contraria vulgus.","The uncertain crowd is split into opposing factions.","犹豫不决的人群分裂成对立的阵营。"],
  [2,228,"Accingunt omnes operi pedibusque rotarum / subiciunt lapsus.","All gird themselves for the task and place rollers beneath the feet.","所有人都投入工作，在脚下放上滚轮。"],
  [2,255,"Tempus erat quo prima quies mortalibus aegris.","It was the hour when first rest comes to weary mortals.","那是疲惫的凡人获得最初安宁的时辰。"],
  [2,289,"Ei mihi, qualis erat, quantum mutatus ab illo / Hectore.","Alas, what a sight he was, how changed from that Hector.","天哪，他变成了什么样子，与从前的赫克托耳判若两人。"],
  [2,302,"Hostis habet muros; ruit alto a culmine Troia.","The enemy holds the walls; Troy topples from her lofty summit.","敌人占领了城墙；特洛伊从她崇高的顶端崩塌。"],
  [2,353,"Sensit medios delapsus in hostis.","He found himself fallen among the enemy.","他发现自己落入了敌人之中。"],
  [2,362,"Quos ubi confertos audere in proelia vidi, / incipio super his.","When I saw them massed and daring battle, I begin to speak.","当我看到他们聚集起来、敢于战斗时，我开口说道。"],
  [2,494,"Fit via vi; rumpunt aditus primosque trucidant / immissi Danai.","A path is made by force; the Greeks burst through the entrance and slaughter the first defenders.","道路被暴力打开；希腊人冲破入口，屠杀了最前面的守卫。"],
  [2,560,"Apparent dirae facies inimicaque Troiae / numina magna deum.","Dread shapes appear, and the great hostile powers of the gods against Troy.","恐怖的面容显现，众神敌视特洛伊的伟大力量现身。"],
  [2,624,"Nate, quis indomitas tantus dolor excitat iras?","Son, what great grief rouses such uncontrollable rage?","孩子，什么巨大的悲痛激起了如此无法遏制的愤怒？"],
  [2,707,"Iam iamque manu tenere et data poscere fata.","Even now, even now to hold with one's hand and claim the promised fate.","就在此刻，伸手去握住、去索取被许诺的命运。"],
  [2,721,"Cessi, et sublato montem genitore petivi.","I yielded, and lifting my father, made for the mountain.","我让步了，背起父亲，向山上走去。"],
  [2,774,"Illa quidem Spartam incolumis patriasque Mycenas / aspiciet.","She indeed will look upon Sparta safe and her native Mycenae.","她确实会安然无恙地再看到斯巴达和她故乡迈锡尼。"],

  // ··· Book III: 流浪与预言 ···
  [3,1,"Postquam res Asiae Priamique evertere gentem / immeritam visum superis.","After the gods above saw fit to overthrow the realm of Asia and Priam's innocent race.","当天上的众神决意颠覆亚细亚的王国和普里阿摩斯无辜的种族之后。"],
  [3,9,"Vix prima inceperat aestas / et pater Anchises dare fatis vela iubebat.","Scarcely had the first summer begun when father Anchises bade us set sail to fate.","夏天刚刚开始，父亲安基塞斯就命令我们扬帆启程，交付命运。"],
  [3,57,"Auri sacra fames, quid non mortalia pectora cogis!","Accursed hunger for gold, to what do you not drive mortal hearts!","对黄金可咒的贪欲啊，你不把凡人的心驱向何处！"],
  [3,85,"Pandite res.","Reveal the truth.","揭示真相吧。"],
  [3,100,"Iussa deum moneo; fata viam invenient.","I tell the commands of the gods; the fates will find a way.","我传达众神的旨意；命运会找到它的路。"],
  [3,147,"Cessas in vota precesque, / Tros, ait, Anchisa?","Do you delay your vows and prayers, Trojan son of Anchises?","安基塞斯的儿子啊，特洛伊人，你还在犹豫祈祷吗？"],
  [3,159,"Corpora permulcent, fugit interea, fugit inreparabile tempus.","They comfort their bodies; meanwhile, time flies, irretrievable time flies.","他们抚慰身体；与此同时，时间在飞逝，不可挽回的时间在飞逝。"],
  [3,262,"Dii, talem terris avertite pestem!","Gods, turn such a plague from the earth!","众神啊，将这样的灾祸从大地上移开！"],
  [3,393,"Nate, Iliacis exercite fatis.","Son, tested by Trojan destinies.","孩子啊，被特洛伊的命运反复磨练。"],
  [3,480,"Iam iam nulla mora est; loquere, et quo tendis in orbem?","Now, now there is no delay; speak — and where on earth do you head?","现在不要再迟疑了；说吧——你要去世界的哪个角落？"],
  [3,493,"Et fata Sibyllam canere et rerum discrimina rerum.","And the Sibyl sings the fates and the crises of things.","西比尔吟唱着命运和事物的危机。"],
  [3,639,"Corpus sine nomine corpus.","A body without a name.","一具没有名字的躯体。"],
  [3,709,"Heu fuge crudelis terras, fuge litus avarum.","Alas, flee these cruel lands, flee this greedy shore.","快逃离这残忍的土地吧，逃离这贪婪的海岸。"],

  // ··· Book IV: 狄多与埃涅阿斯 ···
  [4,24,"Huic uni forsan potui succumbere culpae.","To this one fault perhaps I could have succumbed.","也许只有这一个过错，我可能会屈服。"],
  [4,54,"Solvitque pudorem.","And she dissolved her shame.","她放下了羞耻。"],
  [4,68,"Uritur infelix Dido totaque vagatur / urbe furens.","Unhappy Dido burns and wanders frenzied through the whole city.","不幸的狄多在灼烧中疯狂地游荡于整座城市。"],
  [4,74,"Illum absens absentem auditque videtque.","Absent, she hears and sees him absent.","不在他身边时，她仍能听到他、看到他。"],
  [4,80,"Non coeptae adsurgunt turres, non arma iuventus / exercet.","The towers begun no longer rise; the youth no longer drill at arms.","开建的城塔不再矗立；年轻人也不再操练武器。"],
  [4,109,"Quam simul ac tali persensit peste teneri, / cara Iovis coniunx.","As soon as Jove's dear consort perceived she was gripped by such a plague.","朱庇特的爱妻一旦察觉她被这般热病攫住。"],
  [4,160,"Speluncam Dido dux et Troianus eandem / deveniunt; prima et Tellus et pronuba Iuno / dant signum.","Dido and the Trojan leader come to the same cave; first Earth and bridal Juno give the sign.","狄多和特洛伊首领走进同一个洞穴；大地女神和婚姻之神朱诺率先发出信号。"],
  [4,189,"Tam ficti pravique tenax quam nuntia veri.","As tenacious of falsehood and evil as she is a messenger of truth.","她传播谎言和邪恶的执着，与传递真相时一样坚定。"],
  [4,198,"Ille inter caedem Rutulorum Turnumque ferentem / audit.","He hears of the slaughter of the Rutulians and of Turnus raging.","他听到鲁图利人的屠杀和图尔努斯的暴怒。"],
  [4,298,"Ardet abire fuga dulcisque relinquere terras.","He burns to flee and leave those sweet lands behind.","他急切地想要逃离，将那些甜蜜的土地抛在身后。"],
  [4,314,"Pro re pauca loquar.","For the matter at hand I will say few words.","关于此事，我只说几句。"],
  [4,327,"Nec me meminisse pigebit Elissae, / dum memor ipse mei, dum spiritus hos regit artus.","Nor will it shame me to remember Elissa, while I remember myself, while breath rules these limbs.","只要我还记得自己，只要气息还主宰这身躯，回忆伊丽莎就绝不令我羞愧。"],
  [4,362,"Italiam Lyciae iussere capessere sortes.","The Lycian oracles bade me seek Italy.","吕基亚的神谕命我去寻找意大利。"],
  [4,388,"Spero equidem mediis, si quid pia numina possunt, / supplicia hausurum scopulis.","I hope indeed, if the righteous powers can do anything, that you will drink your punishment among the rocks.","我相信，如果正义的神力还有用处，你将在礁石间吞下你的惩罚。"],
  [4,419,"Extremam hanc oro veniam.","This last grace I beg.","这最后的恩典，我恳求你。"],
  [4,438,"Fata obstant placidasque viri deus obstruit auris.","The fates stand in the way, and god blocks the hero's gentle ears.","命运横在前方，神堵住了英雄温和的双耳。"],
  [4,450,"Ac velut annoso validam cum robore quercum.","As when an ancient oak with sturdy trunk.","犹如一棵年迈的橡树，根深蒂固。"],
  [4,465,"Tandem, o tandem.","At last, O at last.","终于，终于。"],
  [4,474,"Anna, vides toto properari litore circum.","Anna, you see them hurrying all along the shore.","安娜，你看他们沿着海岸四处奔忙。"],
  [4,534,"Certus eundi.","Resolved to go.","决意要走。"],
  [4,550,"Et casus abies visura marinos.","And fir trees destined to see the perils of the sea.","注定将见证海上险途的杉木。"],
  [4,590,"Fac velle; in cineres et hunc descendat honorem.","Make her willing; let this honour too descend into ashes.","让她情愿吧；让这份尊严也随灰烬沉落。"],

  // ··· Book V: 西西里的竞技 ···
  [5,5,"Certus iter fluctusque atros Aquilone secabat.","Resolved on his course, he cut through the dark waves under the north wind.","他坚定航向，在北风中劈开幽暗的波浪。"],
  [5,22,"Superat quoniam Fortuna, sequamur.","Since Fortune prevails, let us follow.","既然命运占了上风，那就跟随它吧。"],
  [5,56,"Hunc ego Gaetulis agerem si Syrtibus exsul.","Even if I were an exile driven among the Gaetulian quicksands.","即使我是一个被驱赶到盖图利亚流沙中的流亡者。"],
  [5,104,"Magnanimi Iovis ingratum ascendimus aequor.","We climb the unwelcome sea of great-hearted Jove.","我们踏上了伟大朱庇特不欢迎我们的海面。"],
  [5,195,"Tum vero ingeminant plausu Trinacriaque litora fervent.","Then indeed they redouble their cheers and the Trinacrian shores seethe.","于是欢呼声加倍响起，特里纳克里亚的海岸沸腾了。"],
  [5,282,"Ille pedum melior motu fretusque iuventa.","He, better in speed of foot and trusting in his youth.","他步伐更快，仗着年轻的力量。"],
  [5,362,"Nec mora, nec requies; vasto certamine tendunt.","No pause, no rest; they strain in the vast contest.","没有停顿，没有喘息；他们在巨大的竞赛中全力以赴。"],
  [5,465,"Substitit Entellus genibusque immobilis ipsis / procubuit.","Entellus stumbled and fell on his very knees, motionless.","恩忒鲁斯绊倒了，跪地不动。"],
  [5,485,"Non iam mater alit Tellus viresque ministrat.","No longer does mother Earth nourish and supply strength.","大地母亲不再滋养他、不再赐予他力量。"],
  [5,535,"Cunctique sequuntur / Dardanidae veterum venerantes dona parentum.","And all the Trojans follow, honouring the gifts of their ancient fathers.","所有的特洛伊人都紧随其后，向先祖的赠礼致敬。"],
  [5,709,"Filius Anchisa cape fata parumper.","Son of Anchises, hear the fates for a moment.","安基塞斯之子，听一刻命运的声音。"],
  [5,741,"Camposque liquentis.","And the liquid plains.","以及流动的原野。"],

  // ··· Book VI: 冥界 ···
  [6,9,"Praescia venturi, da non indebita posco.","Prophetess of the future — I ask only what is owed.","预见未来的女先知——我只索要应得之物。"],
  [6,37,"Phobi nondum patiens, immanis in antro / bacchatur vates.","Not yet yielding to Phoebus, the prophetess raves monstrous in the cave.","尚未屈服于福玻斯的女先知在洞穴中狂乱地喊叫。"],
  [6,54,"Non ulla laborum, / o virgo, nova mi facies inopinave surgit.","No new or unexpected form of toil rises before me, O maiden.","没有任何新的或出乎意料的苦难形态在我面前升起，少女啊。"],
  [6,56,"Omnia praecepi atque animo mecum ante peregi.","All things I have foreseen and traversed beforehand in my mind.","一切我都已预见过，并已在心中提前经历。"],
  [6,71,"Talibus ex adyto dictis Cumaea Sibylla / horrendas canit ambages.","With such words from the sanctuary the Cumaean Sibyl sings her dreadful riddles.","库迈的西比尔从圣所中发出如此话语，吟唱她令人战栗的谜语。"],
  [6,83,"Tantae molis erat Romanam condere gentem.","So great was the effort to found the Roman race.","建立罗马民族，是何等浩大的工程。"],
  [6,100,"Non hoc ista sibi tempus spectacula poscit; / nunc grege de intacto septem mactare iuvencos.","This time does not call for spectacles; now sacrifice seven bullocks from an unblemished herd.","此刻不需要观赏；现在从一群无瑕的牛中宰杀七头。"],
  [6,117,"Si fratrem Pollux alterna morte redemit.","If Pollux redeemed his brother by alternating death.","如果波吕丢刻斯以交替赴死救赎了兄弟。"],
  [6,147,"Sic demum lucos Stygis et regna invia vivis / aspicies.","Only then will you behold the Stygian groves and the realms impassable to the living.","唯有那时你才能望见斯提克斯的丛林和活人不可穿越的领域。"],
  [6,159,"Ergo alta quaerenda / condita.","Therefore the hidden thing must be sought deep.","因此必须在深处寻找那隐藏之物。"],
  [6,190,"Geminae cum forte columbae / ipsa sub ora viri caelo venere volantes.","When by chance a pair of doves came flying from the sky before the very face of the hero.","恰在此时，一对鸽子从天空飞来，正落在英雄面前。"],
  [6,204,"Maternas agnoscit aves laetusque precatur.","He recognizes his mother's birds and joyfully prays.","他认出了母亲的鸟儿，欢喜地祈祷。"],
  [6,210,"Discolor unde auri per ramos aura refulsit.","Whence a different gleam of gold shone through the branches.","从那里，一道异样的金色光辉穿过枝条闪耀。"],
  [6,243,"Chaos et Phlegethon, loca nocte tacentia late.","Chaos and Phlegethon, regions silent far and wide in night.","混沌与火焰河，在夜色中广阔而寂静的区域。"],
  [6,255,"Tros Anchisiade, facilis descensus Averno.","Trojan son of Anchises, easy is the descent to Avernus.","安基塞斯的儿子，特洛伊人，下冥界的路是容易的。"],
  [6,290,"Corripit hic subita trepidus formidine ferrum / Aeneas.","Here Aeneas, trembling with sudden terror, seizes his sword.","埃涅阿斯在突如其来的恐惧中颤抖着抓住了剑。"],
  [6,295,"Quae sint ea numina divum / praecipitat.","He demands what those divine powers are.","他急切地追问那些神力究竟是什么。"],
  [6,314,"Stabant orantes primi transmittere cursum / tendebantque manus ripae ulterioris amore.","They stood begging to make the first crossing, stretching their hands in longing for the farther shore.","他们站在那里乞求先渡过去，向彼岸伸出渴望的双手。"],
  [6,325,"Multa putans sortemque animo miseratus iniquam.","Pondering much and pitying in his heart the unjust fate.","心中反复思量，怜悯这不公的命运。"],
  [6,338,"Nunc me fluctus habet versantque in litore venti.","Now the waves hold me and the winds toss me on the shore.","如今波浪困住了我，风在岸边将我翻转。"],
  [6,364,"Quod te per caeli iucundum lumen et auras.","By heaven's sweet light and breezes.","以天堂甜美的光芒和微风。"],
  [6,388,"Umbrarum hic locus est, somni noctisque soporae.","This is the place of shades, of sleep, and of drowsy night.","这是幽灵的居所，睡眠与昏沉黑夜的领地。"],
  [6,399,"Informi limo glaucaque exponit in ulva.","He lays them in shapeless mud and grey sedge.","他把他们放在无形的泥沼和灰色的水草之中。"],
  [6,405,"Gemuit sub pondere cumba / sutilis et multam accepit rimosa paludem.","The stitched boat groaned under the weight and, full of leaks, took on much marsh water.","缝制的小船在重压下呻吟，裂缝处涌入大量的沼泽水。"],
  [6,413,"Nulla viam virtus, non ipse quidem Achilles.","No bravery carved a path — not even Achilles himself.","没有勇气能开辟出路——就连阿喀琉斯自己也不能。"],
  [6,452,"Nec minus Aeneas, casu percussus iniquo, / prosequitur lacrimis longe et miseratur euntem.","No less did Aeneas, struck by the unjust fate, follow her with tears from afar and pity her as she departed.","埃涅阿斯也同样被不公的命运击中，远远地以泪水追随她，怜悯她的离去。"],
  [6,477,"His demum exactis, perfecto munere divae, / devenere locos laetos.","These things at last fulfilled, the goddess's duty done, they came to joyful regions.","终于完成了这一切、了结了女神的使命之后，他们来到了欢乐的地方。"],
  [6,494,"Quae gratia currum / armorumque fuit vivis, quae cura nitentis / pascere equos, eadem sequitur tellure repostos.","The delight in chariots and arms that was theirs in life, the care in tending sleek horses — the same follows them laid beneath the earth.","生前对战车和武器的热爱、对光亮骏马的照料——同样的热情伴随他们长眠地下。"],
  [6,500,"Stant terra defixae hastae.","Spears stand fixed in the earth.","长矛直直插在地上。"],
  [6,511,"Deiphobus, totumque ingens lacerum crudeliter ora.","Deiphobus, his whole face hideously mutilated.","得伊福布斯，整张脸被残忍地毁坏。"],
  [6,523,"Nunc demum horribili visu portenta deorum.","Now at last the dreadful portents of the gods came into view.","终于，众神恐怖的征兆显现在眼前。"],
  [6,540,"Dextera quae Ditis magni sub moenia tendit.","The right road that leads beneath the walls of great Dis.","通往伟大冥王城墙下方的右边那条路。"],
  [6,548,"Cyclopum educta caminis / moenia conspicio.","I behold walls forged in the furnaces of the Cyclopes.","我望见了在独眼巨人的熔炉中锻造的城墙。"],
  [6,557,"Nec vidisse semel satis est; iuvat usque morari.","Nor is it enough to have seen it once; it delights to linger.","看一次是不够的；令人流连忘返。"],
  [6,563,"Gnossius haec Rhadamanthus habet durissima regna.","Cretan Rhadamanthus rules these harshest realms.","克里特的拉达曼提斯统治着这最严酷的国度。"],
  [6,577,"Discite iustitiam moniti et non temnere divos!","Learn justice, being warned, and scorn not the gods!","受此警示，学会正义，不要蔑视神灵！"],
  [6,628,"Fixit leges pretio atque refixit.","He fixed laws for a price and unfixed them again.","他为了利益制定法律，又再次废除。"],
  [6,644,"His dantur praemia formae.","To these are given the prizes of beauty.","美的奖赏被赐予他们。"],
  [6,648,"Hic manus ob patriam pugnando vulnera passi.","Here are those who suffered wounds fighting for their fatherland.","这里是那些为祖国而战、身负创伤的人。"],
  [6,657,"Omnibus his nivea cinguntur tempora vitta.","All of these have their temples bound with snow-white ribbon.","他们所有人的额头都系着雪白的丝带。"],
  [6,670,"Musaeum ante omnes; medium nam plurima turba / hunc habet, atque umeris exstantem suspicit altis.","Musaeus before all; for the greatest throng surrounds him, and they look up at him towering on high shoulders.","缪赛乌斯高居首位；最大的人群围绕着他，仰望他高耸的肩膀。"],
  [6,679,"At pater Anchises penitus convalle virenti / inclusas animas superumque ad lumen ituras / lustrabat studio recolens.","But father Anchises, deep in a green valley, was reviewing with eager thought the souls enclosed there, destined for the upper light.","但父亲安基塞斯在一片翠绿的深谷中，满怀热忱地审视着那些被封闭在此、注定要前往上界光明的灵魂。"],
  [6,700,"Da iungere dextram, / da, genitor, teque amplexu ne subtrahe nostro.","Let me clasp your hand, father, let me — do not withdraw from my embrace.","让我握住你的手吧，父亲，请不要从我的怀抱中退去。"],
  [6,709,"Principio caelum ac terras camposque liquentis.","In the beginning, heaven and earth and the watery plains.","太初之时，天空、大地和水的原野。"],
  [6,720,"Clausae tenebris et carcere caeco.","Shut in darkness and a blind prison.","被关闭在黑暗和看不见的牢笼之中。"],
  [6,737,"Aliae panduntur inanes suspensae ad ventos.","Others are hung spread empty to the winds.","一些灵魂被悬挂在风中，空荡地展开。"],
  [6,743,"Pauci laeta arva tenemus.","Few of us hold the happy fields.","我们中只有少数人拥有幸福的田野。"],
  [6,748,"Has omnis, ubi mille rotam volvere per annos.","All these, when they have turned the wheel through a thousand years.","所有这些灵魂，在轮转千年之后。"],
  [6,759,"Ille dies omnem cum stirpe fovebit.","That day shall cherish all the race and its offspring.","那一天将爱护整个种族及其后代。"],
  [6,770,"Pax erat, et patriae Rutulo plaudente Camillis.","There was peace, and the Rutulians cheered their native Camillus.","太平降临，鲁图利人向他们的卡米卢斯欢呼。"],
  [6,808,"Orabunt causas melius, caelique meatus / describent radio et surgentia sidera dicent.","Others will plead cases better, and trace the paths of the heavens with a rod, and name the rising stars.","别人会更善于辩论，用尺规描绘天体的轨道，说出升起的星辰之名。"],
  [6,826,"Aspice, ut insignis spoliis Marcellus opimis / ingreditur.","See how Marcellus advances, distinguished by the spoils of honour.","看马尔凯卢斯如何迈步前来，以最高战利品而闻名。"],
  [6,842,"Unus qui nobis cunctando restituit rem.","The one man who by delaying restored the state for us.","那一个人，凭借拖延战术为我们挽救了国家。"],
  [6,860,"Nec puer Iliaca quisquam de gente Latinos / in tantum spe tollet avos.","Nor shall any youth of the Trojan race raise his Latin ancestors to such great hope.","特洛伊血统中不会再有哪个少年让他的拉丁先祖寄予如此厚望。"],
  [6,878,"Nimium vobis Romana propago / visa potens, superi.","Too powerful to you, gods above, seemed the Roman race.","罗马的种族在你们看来太强大了，天上的众神啊。"],
  [6,883,"Quantos ille virum magnam Mavortis ad urbem / campus aget gemitus.","What groans that field shall send up from the warriors to the great city of Mars.","那战场将从勇士们中送出多少叹息，传向玛尔斯的伟大之城。"],
  [6,888,"Tu Marcellus eris.","You shall be Marcellus.","你将成为马尔凯卢斯。"],
  [6,895,"Altera quae laevi cernit sub imagine formas / mittit.","The other gate, gleaming with polished ivory, sends forth forms.","另一扇门，以磨光的象牙闪闪发光，送出幻影。"],
  [6,899,"His ibi tum natum Anchises unaque Sibyllam / prosequitur dictis portaque emittit eburna.","Then Anchises escorts his son and the Sibyl with these words and sends them out through the ivory gate.","安基塞斯以这些话语送别儿子和西比尔，让他们从象牙门离去。"],

  // ··· Book VII: 拉丁姆的战争 ···
  [7,1,"Tu quoque litoribus nostris, Aeneia nutrix.","You too on our shores, Aeneas' nurse.","你也在我们的海岸上，埃涅阿斯的乳母。"],
  [7,53,"Aeterne genitor, non mortale sonans.","Eternal father, not sounding mortal.","永恒的父亲，声音不似凡人。"],
  [7,81,"Ne pete conubiis natam sociare Latinis.","Do not seek to give your daughter in Latin marriage.","不要将你的女儿许配给拉丁人。"],
  [7,116,"Heus, etiam mensas consumimus, inquit Iulus.","Look, we are even eating our tables, said Iulus.","看呀，我们连桌子都吃了，尤卢斯说道。"],
  [7,122,"Hic domus, haec patria est.","Here is our home, here our fatherland.","这里就是我们的家，这里就是我们的祖国。"],
  [7,227,"Rex arva Latinus et urbes / iam senior longa placidas in pace regebat.","King Latinus, now an old man, was ruling the fields and peaceful cities in long peace.","拉丁努斯王已年迈，在漫长的和平中统治着田野和安宁的城市。"],
  [7,313,"Flectere si nequeo superos, Acheronta movebo.","If I cannot bend the gods above, I shall stir the underworld.","如果我无法撼动天上的神，我将搅动地狱。"],
  [7,335,"Luctificam Allecto dirarum ab sede dearum / infernisque ciet tenebris.","She summons grief-bearing Allecto from the seat of the dread goddesses and infernal darkness.","她从可畏女神的座下和冥府的黑暗中召唤出带来悲伤的阿勒克托。"],
  [7,427,"Non iam coniugium antiquum, quod prodidit, optat.","She no longer desires the old marriage she betrayed.","她不再渴望她所背弃的旧日婚姻。"],
  [7,511,"Saevit amor ferri et scelerata insania belli.","The love of the sword rages, and the wicked madness of war.","对刀剑的渴望在燃烧，战争的疯狂邪念在肆虐。"],
  [7,586,"Pandite nunc Helicona, deae.","Now open Helicon, goddesses.","女神们，现在打开赫利孔山。"],
